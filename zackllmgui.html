/* ══════════════════════ 檔案樹 ══════════════════════ */
// 像 VS Code 左邊那一欄：資料夾點開才去問後端要下一層（lazy），
// 一次把整棵樹拉下來的話，node_modules 這種東西會把瀏覽器卡死。
async function lsDir(rel) {
  const res = await fetch(apiUrl('/ls'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: rel || '' })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data.entries || [];
}

function fmtSize(n) {
  if (!n) return '';
  return n < 1024 ? n + 'B'
    : n < 1024 * 1024 ? (n / 1024).toFixed(0) + 'K'
    : (n / 1024 / 1024).toFixed(1) + 'M';
}

function treeRow(entry, depth) {
  const row = document.createElement('div');
  row.className = 'it' + (entry.dir ? ' dir' : '');
  row.style.paddingLeft = (8 + depth * 13) + 'px';
  row.innerHTML = '<span class="tw">' + (entry.dir ? '▶' : '') + '</span>' +
    '<span class="nm"></span>' + (entry.dir ? '' : '<span class="sz"></span>');
  row.querySelector('.nm').textContent = entry.name;
  if (!entry.dir) row.querySelector('.sz').textContent = fmtSize(entry.size);
  row.title = entry.path;
  return row;
}

// open：refreshTree() 傳下來的「重畫前哪些資料夾是開的」，重建之後照樣打開。
// 沒有它的話，模型每寫一個檔就把整棵樹縮回根目錄，沒有人會想開著它。
async function expandInto(box, rel, depth, open) {
  open = open || {};
  // 已經有內容就別閃「讀取中…」：自動重讀時那一下閃爍比不更新還煩
  if (!box.querySelector('.it')) {
    box.innerHTML = '<div class="fv-empty" style="padding:4px 14px;">讀取中…</div>';
  }
  try {
    const entries = await lsDir(rel);
    box.innerHTML = '';
    if (!entries.length) {
      box.innerHTML = '<div class="fv-empty" style="padding:2px 14px;">（空資料夾）</div>';
      return;
    }
    entries.forEach(function (e) {
      const row = treeRow(e, depth);
      const kids = document.createElement('div');
      kids.className = 'kids';
      kids.dataset.rel = e.path;          // refreshTree() 靠這個認出哪一格是開的
      box.appendChild(row);
      box.appendChild(kids);
      if (e.dir && open[e.path]) {
        kids.classList.add('open');
        row.querySelector('.tw').classList.add('open');
        kids.dataset.loaded = '1';
        expandInto(kids, e.path, depth + 1, open);
      }
      row.addEventListener('click', function () {
        if (e.dir) {
          const on = kids.classList.toggle('open');
          row.querySelector('.tw').classList.toggle('open', on);
          if (on && !kids.dataset.loaded) {
            kids.dataset.loaded = '1';
            expandInto(kids, e.path, depth + 1);
          }
          return;
        }
        Array.prototype.forEach.call($('fvTree').querySelectorAll('.it.on'),
          function (x) { x.classList.remove('on'); });
        row.classList.add('on');
        openFile(e.path);
      });
    });
  } catch (err) {
    box.innerHTML = '';
    box.appendChild(Object.assign(document.createElement('div'),
      { className: 'fv-empty', textContent: '讀不到：' + err.message }));
  }
}

function renderTree() {
  showTreeView();
  redrawTree();
}

// 展開狀態不能在重畫時掉。收集現在開著的資料夾，重建時原樣打開。
function openDirs() {
  const out = {};
  Array.prototype.forEach.call($('fvTree').querySelectorAll('.kids.open'),
    function (k) { if (k.dataset.rel) out[k.dataset.rel] = 1; });
  return out;
}

function redrawTree() {
  expandInto($('fvTree'), '', 0, openDirs());
}

// 手動的 ↻，以及工具動過檔案之後的自動重讀。
// 檔案樹本來只在切到這個分頁時讀一次 —— 模型寫了新檔、rm 掉一個資料夾，
// 樹上完全看不出來，只能自己去點別的分頁再切回來。
let treeTimer = null;

function touchTree() {
  S.treeReady = false;      // 沒開著檔案分頁的話，等切過去時自然會重讀
  S.atFiles = null;         // @檔名 的自動完成也是同一份清單，一起作廢
  if (S.tab !== 'file' || !S.ws.path || !S.srv.toolsLocal) return;
  // 一輪常常連改五六個檔，每一個都重畫一次是白做工。收斂成最後一次。
  clearTimeout(treeTimer);
  treeTimer = setTimeout(function () { S.treeReady = true; redrawTree(); }, 400);
}

function showTreeView() {
  $('treeWrap').hidden = false;
  $('viewWrap').hidden = true;
}

/* ══════════════════════ 選資料夾 ══════════════════════ */
// 瀏覽器讀不到你的硬碟（<input type=file> 也只給檔名不給路徑），
// 所以資料夾是跟後端要的。/browse 只回資料夾名稱，不碰任何檔案內容。
async function browseTo(path) {
  const res = await fetch(apiUrl('/browse'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: path || '' })
  });
  const data = await res.json();
  if (!res.ok) { toast(data.error || ('HTTP ' + res.status)); return; }
  S.browse = data;
  // input 要設 value，不是 textContent —— 設 textContent 對 <input> 完全沒作用，
  // 所以框裡一直是空的，只看得到反灰的 placeholder，看不出現在在哪一層。
  $('brPath').value = data.path;
  $('brUp').disabled = !data.parent;
  $('brPickHere').disabled = !data.pickable;
  $('brNote').innerHTML = data.error ? esc(data.error)
    : (data.pickable
      ? '點資料夾往下走，或按「就選這個資料夾」把目前這一層設成工作區。'
      : '家目錄與磁碟根目錄不能當工作區 —— 那等於沒有邊界。往下選一個專案資料夾。');
  const list = $('brList');
  list.innerHTML = '';
  if (!data.dirs.length) {
    list.innerHTML = '<div class="fv-empty">（這一層沒有子資料夾）</div>';
  }
  data.dirs.forEach(function (d) {
    const row = document.createElement('div');
    row.className = 'it';
    row.innerHTML = '<span>📁</span><span class="n"></span>' +
      (d.git ? '<span class="g">git</span>' : '');
    row.querySelector('.n').textContent = d.name;
    row.addEventListener('click', function () {
      browseTo(data.path.replace(/\/+$/, '') + '/' + d.name);
    });
    list.appendChild(row);
  });
}

function openBrowser() {
  $('brOverlay').classList.remove('hidden');
  browseTo(S.ws.path || '');
}

/* ══════════════════════ 還原點（rewind） ══════════════════════ */
// 備份一直都有（每次改檔案前複製一份），缺的是「先後順序」——
// 沒有順序就只能一個檔一個檔還原，沒辦法「退回十分鐘前」。
// serve.py 的 journal.jsonl 記的就是那個順序。
function openRewind() {
  showPanel('params', true);
  showTab('hist');            // 內容由 showTab 去載，不然兩邊會各載一次
}

async function loadHistory() {
  // git 狀態存在 S.ws 裡，只有套用工作區與按下 commit 才會更新 ——
  // 模型改完檔案之後它就過期了，所以進來先問一次。
  if (S.ws.path && (S.ws.git_state || {}).repo) {
    try {
      const res = await fetch(apiUrl('/git'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'status' })
      });
      const g = await res.json();
      if (res.ok) S.ws.git_state = g;
    } catch (e) { /* 拿不到就顯示舊的，不值得為此擋住整頁 */ }
  }
  renderWsGit();
  const box = $('rwList');
  const chat = S.currentId;
  box.innerHTML = '<div class="fv-empty">讀取中…</div>';
  try {
    const res = await fetch(apiUrl('/journal'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat: chat })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (chat !== S.currentId) return;      // 讀的時候使用者已經換過對話了
    renderRewind(data.entries || [], data.total || 0);
  } catch (e) {
    box.innerHTML = '';
    box.appendChild(Object.assign(document.createElement('div'),
      { className: 'fv-empty', textContent: '讀不到紀錄：' + e.message }));
  }
}

// 照 VS Code 原始檔控制那一欄的排法：一行一個檔案，狀態字母在最前面，
// 檔名、目錄（灰）、時間。新的在最上面 —— 要退回去的時候，人想的是
// 「退到剛剛」不是「退到最早」，所以由新到舊 top-down。
function rewindRow(e, newest) {
  const row = document.createElement('div');
  row.className = 'sc-row';
  const created = !!e.created;
  const path = String(e.path || '');
  const cut = path.lastIndexOf('/');
  row.innerHTML = '<span class="st"></span><span class="nm"></span>'
    + '<span class="dir"></span><span class="tm"></span>';
  // A = 新建（Added）、M = 修改（Modified），跟 git 與 VS Code 同一套字母
  const st = row.querySelector('.st');
  st.textContent = created ? 'A' : 'M';
  st.className = 'st ' + (created ? 'a' : 'm');
  row.querySelector('.nm').textContent = cut >= 0 ? path.slice(cut + 1) : path;
  row.querySelector('.dir').textContent = cut > 0 ? path.slice(0, cut) : '';
  row.querySelector('.tm').textContent = clockOf(e.ts);
  row.title = e.ts + '　' + e.tool + '　' + path
    + (created ? '（這一次新建的）' : '（改過，有備份）')
    + (newest ? '\n最新的一筆' : '') + '\n點一下退回這一筆之前的狀態';
  return row;
}

// journal 存的是 "2026-08-25 14:31:46"。同一天只顯示時分秒，
// 跨天的話上面會有一條日期分隔 —— 一長串重複的年月日只會擋住要看的東西。
function clockOf(ts) {
  const parts = String(ts || '').split(' ');
  return parts.length > 1 ? parts[1] : String(ts || '');
}

function dayOf(ts) { return String(ts || '').split(' ')[0]; }

function renderRewind(entries, total) {
  const box = $('rwList');
  box.innerHTML = '';
  $('rwCount').textContent = entries.length;
  if (!entries.length) {
    box.innerHTML = '<div class="fv-empty">' + (total
      ? '這則對話還沒改過檔案（工作區裡有其他對話改的 ' + total + ' 筆）。'
      : '還沒有改過任何檔案。') + '</div>';
    return;
  }
  // 用本機時間組今天的日期，不要用 toISOString（那是 UTC，跨日的時候會差一天）。
  // journal 的時間戳是 serve.py 那台的本機時間 —— 遠端開網頁又跨時區的話，
  // 這裡只會少顯示「今天」兩個字，日期本身還是對的。
  const n = new Date();
  const today = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0')
    + '-' + String(n.getDate()).padStart(2, '0');
  let day = '';
  entries.slice().reverse().forEach(function (e, i) {
    const d = dayOf(e.ts);
    if (d !== day) {
      day = d;
      const sep = document.createElement('div');
      sep.className = 'sc-row day';
      sep.textContent = d === today ? '今天' : d;
      box.appendChild(sep);
    }
    const row = rewindRow(e, i === 0);
    row.addEventListener('click', function () {
      // 還原一定是照時間倒著做的，所以會連帶退掉別則對話在這之後改的東西。
      // 只顯示這一則卻偷偷動到別人的，那是騙人 —— 講出來讓使用者決定。
      const others = e.other_chats
        ? '\n其中 ' + e.other_chats + ' 筆是「其他對話」改的，也會一起退回去。' : '';
      if (!confirm('把工作區退回這一筆之前的樣子？\n\n' +
                   e.ts + ' ' + e.tool + ' ' + e.path +
                   '\n\n會退回 ' + e.undo_count + ' 筆改動。' + others +
                   '\n對話內容不受影響。')) return;
      doRewind(e.id);
    });
    box.appendChild(row);
  });
}

async function doRewind(id) {
  try {
    const res = await fetch(apiUrl('/rewind'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    loadHistory();                 // 重讀：這一則對話剩下哪些還原點
    toast('已還原 ' + (data.undone || []).length + ' 筆' +
      ((data.failed || []).length ? '，' + data.failed.length + ' 筆失敗' : ''));
    if ((data.failed || []).length) console.warn('rewind 失敗的項目', data.failed);
    if (S.tab === 'file' && S.ws.path) renderWorkspace();
    if (S.tab === 'hist') loadHistory();          // 檔案退回去了，git 狀態也跟著變
  } catch (e) {
    toast('還原失敗：' + e.message);
  }
}

/* ══════════════════════ 修改檔案的開關 ══════════════════════ */
// 從選單裡搬出來變成輸入框旁邊的按鈕：它是每天要按好幾次的東西，
// 不該藏在兩層選單底下。
function writeReason() {
  if (!S.srv.tools) return toolsReason() || '本機工具沒有開啟';
  if (!S.ws.path) return '要先選一個工作區資料夾';
  return '';
}

function renderWriteBtn() {
  const btn = $('writeBtn');
  if (!btn) return;
  const why = writeReason();
  btn.classList.toggle('on', !!S.ws.write);
  btn.disabled = !!why;
  btn.title = why || (S.ws.write
    ? '模型可以修改檔案（每一次仍然要你按確認）— 點一下關閉'
    : '模型目前只讀得到檔案 — 點一下允許修改');
}

async function toggleWrite() {
  const why = writeReason();
  if (why) { toast(why); return; }
  try {
    await setServerTools({ write: !S.ws.write });
    toast(S.ws.write ? '模型可以修改檔案了，每一次仍然要你按確認' : '已改回唯讀');
  } catch (e) {
    toast('切換失敗：' + e.message);
  }
  renderWriteBtn();
  renderFeatBtn();
}

// 重開之後把 serve.py 那一端的狀態接回來。
//
// 為什麼需要這個：工作區與四個開關都是 serve.py 的**行程全域**，重啟 serve.py
// 就回到預設；自動模式與其他偏好卻存在瀏覽器的 localStorage 裡。兩邊不對齊的
// 症狀是「自動模式已經放到最開，但模型改不動檔案」—— 看起來像壞掉，其實是
// 伺服器那邊的「修改檔案」根本沒開。
//
// 順序有意義：**工作區一定要先設**，因為 serve.py 的 ALLOW_WRITE 有
// `and WORKSPACE is not None`，沒有工作區的時候 write:true 會被靜靜吃掉。
async function restoreServerState(conf) {
  const done = [];
  const want = (current() || {}).ws || conf.wsPath || '';
  if (want && want !== S.ws.path) {
    try { await applyWorkspace(want); done.push('工作區'); }
    catch (e) { toast('上次的工作區接不回來（' + want + '）：' + e.message); }
  }
  const saved = conf.srv || {};
  const patch = {};
  if (saved.tools !== undefined && !!saved.tools !== !!S.srv.tools) patch.enabled = !!saved.tools;
  if (saved.write !== undefined && !!saved.write !== !!S.ws.write) patch.write = !!saved.write;
  if (saved.browser !== undefined && !!saved.browser !== !!S.srv.browser) patch.browser = !!saved.browser;
  if (saved.sandbox !== undefined && !!saved.sandbox !== !!S.srv.sandbox) patch.sandbox = !!saved.sandbox;
  // 自動模式存在瀏覽器、serve.py 重啟就回到 off。不推回去的話系統提示會停在
  // 「每一次都會問你」，而實際上沒有人在按 —— 模型會一輪讀一個檔。
  if (S.auto && S.auto !== 'off') patch.auto = S.auto;
  if (Object.keys(patch).length) {
    const label = { enabled: '本機工具', write: '修改檔案', browser: '連網瀏覽', sandbox: '沙盒' };
    try {
      await setServerTools(patch);
      Object.keys(patch).filter(function (k) { return label[k]; })
        .forEach(function (k) { done.push(label[k] + (patch[k] ? '' : '（關）')); });
    } catch (e) {
      // 非本機的瀏覽器會被 serve.py 擋掉（403），那是對的，不要吵
      if (S.srv.toolsLocal !== false) toast('開關接不回來：' + e.message);
    }
  }
  // **一定要說出來**：靜靜地把「修改檔案」打開，跟使用者沒有按過那個鈕是兩回事
  if (done.length) toast('接回上次的設定：' + done.join('、'));
  renderWriteBtn();
  renderFeatBtn();
  renderWorkspace();
}


async function applyWorkspace(path) {
  const res = await fetch(apiUrl('/workspace'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: path })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  S.ws = Object.assign({ path: '', write: false }, data);
  S.atFiles = null;                    // 換了工作區，@ 的檔案清單就過期了
  S.toolDefs = data.tool_defs || [];
  S.agentRules = data.agent_rules || '';
  renderWorkspace();
  ensureFileList();                    // 先拉起來：模型寫的「檔案:行號」要靠它才連得起來
  const c = current();                 // 工作區跟著對話走：下次點回這則就切回來
  if (c) { c.ws = S.ws.path || ''; saveChats(); }
  saveConfig();
  const names = toolDefs().map(function (d) { return d.function.name; });
  toast(S.ws.path
    ? '工作區：' + S.ws.path + '（' + (S.ws.files || 0) + ' 個檔案，'
      + names.length + ' 支工具可用）'
    : '已清除工作區，檔案類工具已停用');
  return data;
}

// 執行前一定要人點頭。工具會在跑 serve.py 的那台機器上動手，不能自動放行。
// unified diff 上色。+ 綠、- 紅、@@ 灰，其餘原樣。
function renderDiff(text) {
  return text.split('\n').map(function (line) {
    const c = line.charAt(0);
    const cls = line.indexOf('@@') === 0 ? 'h'
      : (c === '+' && line.indexOf('+++') !== 0) ? 'a'
      : (c === '-' && line.indexOf('---') !== 0) ? 'd' : '';
    return cls ? '<span class="' + cls + '">' + esc(line) + '</span>' : esc(line);
  }).join('\n');
}

// 先跟後端要「這一次的預覽」：改檔案是 diff，跑指令是風險評估。
// 自動模式要不要放行也看它的結論，所以一定要等它回來。
async function toolPreview(name, args) {
  // 以前只有改檔案與跑指令要問後端。現在每一支都要問 —— 允許規則可能命中任何工具，
  // 而規則要在伺服器那一端算（那裡才是真的擋得住的地方）。
  try {
    const res = await fetch(apiUrl('/preview'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, args: args })
    });
    const data = await res.json();
    return { diff: data.diff || data.error || '', risk: data.risk || 'ok',
             rule: data.rule || null, scope: data.scope || '' };
  } catch (e) {
    return { diff: '', risk: 'ok', rule: null, scope: '' };
  }
}

/* ══════════════════════ 允許規則 ══════════════════════ */
// 自動模式是全有全無的三段，但人想要的從來不是那三個，而是
// 「pytest 一律放行、git commit 要問我、secrets/ 永遠不准碰」。
// 規則就是把這種判斷寫下來一次。真正的擋在 serve.py 那一端。

// 從這一次的呼叫猜一條合理的規則。猜的是「同一類」，不是「一模一樣」——
// 每跑一次 pytest 就多一條規則的話，那張清單三天就沒人看得懂了。
function ruleSuggestion(name, args) {
  if (name === 'run_shell' || name === 'run_tests') {
    const cmd = String((args && args.command) || '').trim();
    if (!cmd) return { tool: name, pattern: '*' };
    // 取前兩個詞：git commit -m … → git commit*
    const bits = cmd.split(/\s+/).slice(0, cmd.split(/\s+/)[0] === 'git' ? 2 : 1);
    return { tool: name, pattern: bits.join(' ') + '*' };
  }
  const path = String((args && args.path) || '');
  if (path) {
    const cut = path.lastIndexOf('/');
    return { tool: name, pattern: cut > 0 ? path.slice(0, cut) + '/**' : '*' };
  }
  return { tool: name, pattern: '*' };
}

async function rulesCall(body) {
  const res = await fetch(apiUrl('/rules'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  S.rules = data.rules || [];
  S.ruleFiles = data.files || [];
  return data;
}

function addRule(tool, pattern, action, note) {
  return rulesCall({ action: 'add', tool: tool, pattern: pattern,
                     rule: action, note: note || '' });
}

async function openRules() {
  try { await rulesCall({ action: 'list' }); }
  catch (e) { toast('讀不到規則：' + e.message); return; }
  renderRules();
  $('rlOverlay').classList.remove('hidden');
}

function renderRules() {
  const box = $('rlList');
  box.innerHTML = '';
  $('rlPath').textContent = (S.ruleFiles || []).map(function (f) {
    return f.scope + '：' + f.path + (f.exists ? '' : '（還沒有）');
  }).join('\n');
  if (!(S.rules || []).length) {
    box.innerHTML = '<div class="fv-empty">還沒有規則。'
      + '確認卡上的「以後都放行」會在這裡留下一條。</div>';
    return;
  }
  S.rules.forEach(function (r, i) {
    const row = document.createElement('div');
    row.className = 'mm-row';
    row.innerHTML = '<span class="st"></span><span class="n"></span>'
      + '<span class="m"></span><button class="mini danger" data-del>刪除</button>';
    const st = row.querySelector('.st');
    st.textContent = { allow: '放行', ask: '要問', deny: '禁止' }[r.action] || r.action;
    st.style.color = r.action === 'deny' ? 'var(--err)'
      : (r.action === 'allow' ? 'var(--accent)' : 'var(--ink3)');
    row.querySelector('.n').textContent = r.tool + '　' + r.pattern;
    // 專案的規則只在這個工作區有效，全域的到哪都算 —— 看得出來才不會刪錯
    row.querySelector('.m').textContent = (r.scope || '') + (r.note ? '　' + r.note : '');
    row.querySelector('[data-del]').addEventListener('click', async function () {
      try { await rulesCall({ action: 'remove', index: i }); renderRules(); }
      catch (e) { toast('刪不掉：' + e.message); }
    });
    box.appendChild(row);
  });
}

async function addRuleFromDialog() {
  const tool = $('rlTool').value.trim() || '*';
  const pattern = $('rlPattern').value.trim() || '*';
  try {
    await addRule(tool, pattern, $('rlAction').value);
    $('rlPattern').value = '';
    renderRules();
  } catch (e) { toast('加不上去：' + e.message); }
}

function confirmTool(name, args, pre) {
  return new Promise(function (resolve) {
    const write = WRITE_TOOLS.indexOf(name) >= 0;
    const plan = name === 'submit_plan';
    const risky = (pre && pre.risk && pre.risk !== 'ok') ? pre.diff : '';
    const el = msgEl('assistant');
    el.innerHTML =
      '<div class="msg-avatar">' + ico('wrench', 14, 2) + '</div>' +
      '<div class="msg-col"><div class="tool-card">' +
        '<div class="th">模型要求執行 <span class="nm"></span><span class="st fp"></span></div>' +
        '<pre class="args"></pre>' +
        '<div class="ta"><button class="mini" data-go>執行</button>' +
        '<button class="mini danger" data-no>略過</button>' +
        '<button class="mini" data-always hidden>以後都放行</button>' +
        '<span class="st">會在 serve.py 那台機器上執行</span></div>' +
      '</div></div>';
    el.querySelector('.nm').textContent = plan ? '（計畫）' : name;
    el.querySelector('.args').textContent = plan
      ? String(args.plan || '') : JSON.stringify(args, null, 2);
    if (plan) {
      el.querySelector('.th').firstChild.textContent = '模型提出的計畫，核准後才開放修改檔案 ';
      el.querySelector('[data-go]').textContent = '核准';
      el.querySelector('[data-no]').textContent = '退回';
      el.querySelector('.ta .st').textContent = '核准之後 write_file / edit_file 才會出現';
    }
    if (write) el.querySelector('.fp').textContent = '· ' + (args.path || '');
    if (risky) {
      const warn = el.querySelector('.fp');
      warn.textContent = risky;
      warn.style.color = 'var(--err)';
    }
    $('thread').appendChild(el);
    S.stick = true;
    pin();
    waitBadge(true);
    notifyBg('等你確認：' + (plan ? '模型提出的計畫' : name)
      + (write && args.path ? ' · ' + args.path : '')
      + (risky ? ' · ' + risky : ''));

    // 改檔案的話，把參數換成看得懂的 diff —— 沒人有辦法從一坨 JSON 判斷該不該按下去
    if (write && pre && pre.diff) {
      const box = el.querySelector('.args');
      box.className = 'args diff';
      box.innerHTML = renderDiff(pre.diff);
    }

    // 「以後都放行」：把這一次的判斷寫成規則，不用每天重新點一遍。
    // 風險指令不給這顆 —— 那條保證不能被一顆順手的按鈕拿掉。
    const always = el.querySelector('[data-always]');
    const sug = ruleSuggestion(name, args);
    if (sug && !risky && !plan) {
      always.hidden = false;
      always.title = '之後 ' + sug.tool + ' 遇到 ' + sug.pattern + ' 就直接執行';
      always.addEventListener('click', async function () {
        try {
          await addRule(sug.tool, sug.pattern, 'allow');
          toast('已加規則：' + sug.tool + ' / ' + sug.pattern + ' 直接放行');
        } catch (e) { toast('規則存不起來：' + e.message); }
        done(true);
      });
    }

    const done = function (ok) { waitBadge(false); el.remove(); resolve(ok); };
    el.querySelector('[data-go]').addEventListener('click', function () { done(true); });
    el.querySelector('[data-no]').addEventListener('click', function () { done(false); });
  });
}

// 同一個呼叫（工具名＋參數完全一樣）連續失敗幾次就不再送。
// 模型會用一模一樣的參數重試失敗的呼叫 —— 系統提示裡寫了「不要這樣」，
// 但那是規則不是機制。自動模式下沒有人在按確認，25 輪就這樣燒完了，
// 而且畫面上看起來它「還在做事」。
const REPEAT_LIMIT = 2;
// ponytail: 比的是「工具名＋參數完全一樣」。差一個空白就繞過去了，
//           但模型重試時通常是原封不動送同一份。真的漏掉再做正規化。

function callKey(name, args) {
  try { return name + '\u0000' + JSON.stringify(args || {}); }
  catch (e) { return name; }               // 參數塞不進 JSON 就只比工具名
}

// 一次工具呼叫：預覽 → 確認（或自動放行）→ 執行，結果寫回 msg。
// 主迴圈與子代理共用這一支 —— 兩份實作的話，「危險指令一定要問人」
// 遲早會有一份忘了跟上。
async function execTool(name, args, msg) {
  const key = callKey(name, args);
  S.run.fails = S.run.fails || {};
  if (S.run.fails[key] >= REPEAT_LIMIT) {
    msg.content = '（這個呼叫用一模一樣的參數已經失敗 ' + REPEAT_LIMIT +
      ' 次，所以沒有再跑一次。換個做法：先用 read_file 或 list_dir 確認實際情況、' +
      '改參數、或改用別的工具。重複同一個呼叫不會有不同的結果。）';
    msg.failed = true;
    msg.blocked = true;
    return msg;
  }
  const pre = await toolPreview(name, args);
  if (pre.rule && pre.rule.action === 'deny') {
    // 規則說不行就不要問了。真正的擋在伺服器那一端，這裡只是不要白問一次。
    msg.content = '（允許規則擋下來了：' + pre.rule.tool + ' / ' + pre.rule.pattern
      + (pre.rule.note ? '　' + pre.rule.note : '') + '）';
    msg.failed = true;
    msg.blocked = true;
    return msg;
  }
  const auto = autoApprove(name, pre.risk, pre.rule, pre.scope);
  if (!auto && !await confirmTool(name, args, pre)) {
    msg.content = '（使用者拒絕執行這個工具）';
    msg.denied = true;
    return msg;
  }
  msg.auto = auto;
  S.run.calls += 1;
  // 不串流的工具，結果卡是**跑完之後**才貼上來的 —— setup_env 裝套件裝兩分鐘，
  // 這中間畫面上一個字都不會多。把正在跑的那一支寫進進度條，秒數本來就在走。
  S.run.now = name;
  renderRunBar();
  try {
    // 會跑很久的那兩支邊跑邊顯示；其他工具一次回來就好
    if (S.streamTools.indexOf(name) >= 0 && !args.background) {
      msg.content = await runStreamed(name, args);
      msg.failed = msg.content.indexOf('錯誤：') === 0;
      msg.streamed = true;
      S.run.now = '';
      touchTree();                         // run_shell／run_tests 最常動到檔案
      if (msg.failed) S.run.fails[key] = (S.run.fails[key] || 0) + 1;
      else delete S.run.fails[key];
      return msg;
    }
    const res = await fetch(apiUrl('/tool'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, args: args, chat: S.currentId })
    });
    const data = await res.json();
    if (data.jobs) { S.jobs = data.jobs; renderRunBar(); }
    msg.content = res.ok ? data.result : ('錯誤：' + (data.error || ('HTTP ' + res.status)));
    msg.failed = !res.ok;
    // serve.py 用 [backup]路徑 回報備份位置；那是給介面用的，別佔模型的 context
    const at = msg.content.indexOf('[backup]');
    if (at >= 0) {
      msg.backup = msg.content.slice(at + 8).trim();
      msg.content = msg.content.slice(0, at).trim();
    }
    if (data.todos) { S.todos = data.todos; renderTodos(); }
    if (data.tool_defs) S.toolDefs = data.tool_defs;   // 核准計畫後會多出寫入工具
  } catch (e) {
    msg.content = '錯誤：' + e.message;
    msg.failed = true;
  }
  S.run.now = '';
  renderRunBar();
  if (msg.failed) S.run.fails[key] = (S.run.fails[key] || 0) + 1;
  else delete S.run.fails[key];            // 成功過就重新計算
  // 失敗的也要重讀：run_shell 跑到一半掛掉，前半段的檔案已經寫下去了
  if (READ_ONLY_TOOLS.indexOf(name) < 0) touchTree();
  if (!msg.failed) noteFinishSignals(name, args);
  return msg;
}

/* ══════════════════════ 子代理 ══════════════════════ */
// 「掃過整個專案找出所有用到 X 的地方」這種事，自己做會把幾十個檔案的內容
// 灌進主對話，之後每一輪都要重送。子代理有自己的 context，只有結論回來。
const SUB_ROUNDS = 8;

function subTools() {
  // 不給 task：子代理再開子代理就沒有底了。
  // 不給 ask_user_question：它問了也沒人看得懂上下文，該問就回報給主代理去問。
  return toolDefs().filter(function (d) {
    return ['task', 'ask_user_question', 'submit_plan'].indexOf(d.function.name) < 0;
  });
}

async function runSubagent(args) {
  const task = String((args && (args.prompt || args.task)) || '').trim();
  if (!task) return '錯誤：task 要給 prompt';

  const el = msgEl('assistant');
  el.innerHTML =
    '<div class="msg-avatar">' + ico('wrench', 14, 2) + '</div>' +
    '<div class="msg-col"><div class="tool-card"><div class="th">子代理 ' +
    '<span class="st">進行中</span></div><pre class="out" style="margin:0;"></pre></div></div>';
  const out = el.querySelector('.out');
  out.textContent = task;
  $('thread').appendChild(el);
  pin();
  const log = function (line) { out.textContent += '\n' + line; pin(); };

  const msgs = [{ role: 'system', content:
    '你是子代理，只負責完成交辦的這一件事。你有跟主代理一樣的工具，但是：\n'
    + '- 不能再開子代理，也問不到使用者，卡住就把卡在哪裡寫進結論。\n'
    + '- 做完用不超過 15 行回報結論，帶上關鍵的檔案與行號。\n'
    + '- 你的過程不會被主代理看到，只有最後這段文字會，所以結論要能單獨讀懂。\n\n'
    + (agentRules() || '') }, { role: 'user', content: task }];

  try {
    for (let i = 1; i <= SUB_ROUNDS; i++) {
      el.querySelector('.st').textContent = '第 ' + i + '/' + SUB_ROUNDS + ' 輪';
      const body = { model: S.model, messages: msgs, tools: subTools(), stream: false };
      const opts = buildOptions();
      if (Object.keys(opts).length) body.options = opts;
      if (thinkValue() !== null) body.think = false;      // 子代理不用思考，省時間
      const data = await apiJson('/api/chat', body, 600000);
      const m = data.message || {};
      msgs.push(m);
      const tcs = m.tool_calls || [];
      if (!tcs.length) {
        const text = (m.content || '').trim();
        el.querySelector('.tool-card').classList.add('done');
        el.querySelector('.st').textContent = '完成（' + i + ' 輪）';
        log('→ ' + (text || '（沒有結論）'));
        return text || '（子代理沒有給出結論）';
      }
      for (let k = 0; k < tcs.length; k++) {
        const fn = tcs[k].function || {};
        let a = fn.arguments;
        if (typeof a === 'string') { try { a = JSON.parse(a); } catch (e) { a = {}; } }
        log('· ' + fn.name + ' ' + JSON.stringify(a || {}).slice(0, 120));
        const r = await execTool(fn.name || '', a || {},
          { role: 'tool', tool_name: fn.name, content: '' });
        msgs.push({ role: 'tool', tool_name: fn.name, content: String(r.content || '') });
      }
    }
    el.querySelector('.st').textContent = '輪數用完';
    return '（子代理跑了 ' + SUB_ROUNDS + ' 輪還沒有結論，任務可能太大，拆小一點再交辦）';
  } catch (e) {
    el.querySelector('.st').textContent = '失敗';
    log('→ ' + e.message);
    return '子代理失敗：' + e.message;
  }
}

// 給 finishCheck 用的兩個訊號。只在工具**成功**之後記 ——
// 寫失敗的測試檔不算寫過，跑失敗的測試倒是算跑過（跑了就會看到紅字）。
function noteFinishSignals(name, args) {
  if (looksLikeTestRun(name, args)) S.run.ranTests = true;
  // delete_file 也在 WRITE_TOOLS 裡，但**刪掉一個測試檔不算寫了測試** ——
  // 算進去的話「寫了測試沒跑」會對著一個已經不存在的檔案叫
  else if (name !== 'delete_file' && WRITE_TOOLS.indexOf(name) >= 0
           && looksLikeTestFile((args || {}).path)) {
    S.run.wroteTests = String(args.path);
  }
}

async function runTools(c, calls, depth) {
  // 停在這裡不等於結束：把原因記在對話上，續跑條就會冒出來，按下去重新算一段。
  // 之前是 toast 一句就沒了 —— 跑了二十分鐘的任務停在半路，連怎麼接回去都沒說。
  const over = depth > MAX_TOOL_ROUNDS
    ? '工具連續跑了 ' + MAX_TOOL_ROUNDS + ' 輪，停在這裡' : budgetStop(S.run);
  if (over) {
    c.stopWhy = over;
    saveChats();
    stopRunTicker();
    markTurnDone(c);
    renderResumeBar();
    toast(over + ' —— 下面有「繼續」');
    return;
  }
  S.run.rounds = depth;
  renderRunBar();
  startRunTicker();
  // 不鎖輸入框了：跑十分鐘的任務不該讓人只能乾等。打字會排隊（submitFromInput），
  // 送出鍵維持「停止」的語意，所以按鍵仍然是停用的。
  blockComposer(RUNNING_HINT);
  for (let i = 0; i < calls.length; i++) {
    const fn = (calls[i] || {}).function || {};
    const name = fn.name || '';
    let args = fn.arguments;
    if (typeof args === 'string') { try { args = JSON.parse(args); } catch (e) { args = {}; } }
    args = args || {};

    const msg = { role: 'tool', tool_name: name, args: args, content: '' };

    // 這兩支不送到 /tool：伺服器上沒有人可以回答，模型迴圈也在瀏覽器這一端
    if (name === 'ask_user_question') {
      msg.content = await askUser(args);
      c.messages.push(msg);
      saveChats();
      continue;
    }
    if (name === 'task') {
      msg.content = await runSubagent(args);
      c.messages.push(msg);          // 只存結論：過程留在子代理自己的 context 裡
      saveChats();
      continue;
    }

    await execTool(name, args, msg);
    if (msg.streamed) {
      c.messages.push(msg);
      saveChats();
      $('thread').appendChild(buildToolMsg(msg));
      pin();
      continue;
    }
    c.messages.push(msg);
    saveChats();
    $('thread').appendChild(buildToolMsg(msg));
    pin();
  }
  blockComposer('');
  flushQueue(c);          // 使用者在這一輪打的字，跟工具結果一起送過去
  await runStream(c, depth);
}

/* ══════════════════════ 分支 ══════════════════════ */
function forkChat(idx) {
  const c = current();
  if (!c || !c.messages.length) { toast('這個對話還沒有內容'); return; }
  const upto = idx < 0 ? c.messages.length : idx + 1;
  const copy = {
    id: uid(), title: c.title.replace(/（分支.*）$/, '') + '（分支）', model: c.model,
    renamed: true, created: Date.now(),
    messages: JSON.parse(JSON.stringify(c.messages.slice(0, upto)))
  };
  S.chats.unshift(copy);
  S.currentId = copy.id;
  renderChatList();
  renderThread();
  saveChats();
  toast('已分支出新對話（' + upto + ' 則訊息）');
}

function renameChat(id) {
  const c = S.chats.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  const name = (prompt('對話名稱', c.title) || '').trim();
  if (!name) return;
  c.title = name;
  c.renamed = true;          // 別再被第一則訊息蓋掉
  renderChatList();
  saveChats(c);              // 改的不一定是當下開著的那則，要指名

}

/* ══════════════════════ 模型管理 ══════════════════════ */
function mmRow(name, meta, btnLabel, danger, action) {
  const row = document.createElement('div');
  row.className = 'mm-row';
  row.innerHTML = '<span class="n"></span><span class="m"></span>' +
    '<button class="mini' + (danger ? ' danger' : '') + '"></button>';
  row.querySelector('.n').textContent = name;
  row.querySelector('.m').textContent = meta;
  const btn = row.querySelector('button');
  btn.textContent = btnLabel;
  btn.addEventListener('click', function () { action(btn); });
  return row;
}

async function refreshModelManager() {
  const mm = $('mmList'), ps = $('psList');
  const external = S.provider === 'openai';
  $('pullRow').hidden = external;
  mm.textContent = '載入中…';
  await refreshModels(true);
  mm.innerHTML = '';
  S.models.forEach(function (m) {
    const meta = [(m.details && m.details.parameter_size) || '',
      m.size ? humanSize(m.size) : ''].filter(Boolean).join(' · ');
    if (external) {
      const row = document.createElement('div');
      row.className = 'mm-row';
      row.innerHTML = '<span class="n"></span>';
      row.querySelector('.n').textContent = m.name;
      mm.appendChild(row);
      return;
    }
    mm.appendChild(mmRow(m.name, meta, '刪除', true, function () { deleteModel(m.name); }));
  });
  if (!S.models.length) mm.textContent = '（這台主機還沒有下載任何模型）';

  if (external) {
    ps.textContent = '（外部 API 不提供下載、刪除與記憶體資訊）';
    return;
  }
  ps.textContent = '載入中…';
  try {
    const data = await apiJson('/api/ps', null, 5000);
    const running = data.models || [];
    ps.innerHTML = '';
    running.forEach(function (m) {
      ps.appendChild(mmRow(m.name, humanSize(m.size || 0) + ' 記憶體', '卸載', false, function (btn) {
        btn.disabled = true;
        unloadModel(m.name);
      }));
    });
    if (!running.length) ps.textContent = '（目前沒有模型佔用記憶體）';
  } catch (e) {
    ps.textContent = '讀不到 /api/ps：' + friendlyError(e).msg;
  }
}

async function deleteModel(name) {
  if (!confirm('確定刪除模型「' + name + '」？這會從主機上移除檔案。')) return;
  try {
    const res = await fetch(apiUrl('/api/delete'), {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: name })
    });
    if (!res.ok) throw new Error(await res.text());
    toast('已刪除 ' + name);
    await refreshModelManager();
  } catch (e) { toast('刪除失敗：' + friendlyError(e).msg); }
}

async function unloadModel(name) {
  // keep_alive 0 就是「馬上放掉」，Ollama 沒有專門的 unload API
  try {
    await apiJson('/api/generate', { model: name, keep_alive: 0 }, 15000);
    toast('已卸載 ' + name);
  } catch (e) { toast('卸載失敗：' + friendlyError(e).msg); }
  await refreshModelManager();
}

// Hugging Face 的 GGUF 走 hf.co/{使用者}/{儲存庫}:{量化}；
// 使用者多半是直接複製網址或整行指令，這裡一併收下。
function normalizePull(v) {
  let t = String(v || '').trim();
  t = t.replace(/^ollama\s+(pull|run)\s+/i, '').replace(/^["']|["']$/g, '').trim();
  t = t.replace(/^https?:\/\//i, '');
  const hf = /^(?:hf\.co|huggingface\.co)\/([^/\s]+)\/([^/\s:?#]+)(?::([\w.-]+))?/i.exec(t);
  if (hf) return 'hf.co/' + hf[1] + '/' + hf[2] + (hf[3] ? ':' + hf[3] : '');
  return t.replace(/\/+$/, '');
}

async function pullModel() {
  const name = normalizePull($('pullInput').value);
  if (!name) { toast('先填模型名稱，例如 qwen3:8b'); return; }
  $('pullInput').value = name;                 // 讓使用者看到實際會送出的名字
  $('pullProgress').hidden = false;
  $('pullBtn').disabled = true;
  $('pullFill').style.width = '0%';
  $('pullText').textContent = '連線中…';
  S.pullAbort = new AbortController();
  try {
    await streamNdjson('/api/pull', { model: name, stream: true }, S.pullAbort.signal, function (obj) {
      const pct = obj.total ? (obj.completed || 0) / obj.total * 100 : 0;
      $('pullFill').style.width = pct + '%';
      $('pullText').textContent = (obj.status || '') +
        (obj.total ? '  ' + humanSize(obj.completed || 0) + ' / ' + humanSize(obj.total) : '');
    });
    toast(name + ' 下載完成');
    $('pullInput').value = '';
    await refreshModelManager();
  } catch (e) {
    const f = friendlyError(e);
    toast(f.abort ? '已取消下載' : ('下載失敗：' + f.msg));
  } finally {
    $('pullProgress').hidden = true;
    $('pullBtn').disabled = false;
    S.pullAbort = null;
  }
}

function openModels() {
  $('modelsOverlay').classList.remove('hidden');
  refreshModelManager();
}

/* ══════════════════════ 多模型比較 ══════════════════════ */
function openCompare() {
  if (!S.models.length) { toast('還沒有可用的模型'); return; }
  ['A', 'B'].forEach(function (k, i) {
    const sel = $('cmpModel' + k);
    sel.innerHTML = '';
    S.models.forEach(function (m) {
      const o = document.createElement('option');
      o.value = m.name; o.textContent = m.name;
      sel.appendChild(o);
    });
    sel.value = (i === 0 ? (S.model || S.models[0].name)
      : (S.models[1] || S.models[0]).name);
  });
  $('cmpOverlay').classList.remove('hidden');
  $('cmpPrompt').focus();
}

async function runCompare() {
  const prompt = $('cmpPrompt').value.trim();
  if (!prompt) { toast('先寫一個提示'); return; }
  const sys = ($('system').value || '').trim();
  const msgs = (sys ? [{ role: 'system', content: sys }] : []).concat([{ role: 'user', content: prompt }]);
  const opts = buildOptions();
  $('cmpRun').disabled = true;
  await Promise.all(['A', 'B'].map(function (k) {
    const model = $('cmpModel' + k).value;
    const body = $('cmpBody' + k), stat = $('cmpStat' + k);
    body.innerHTML = '<span class="caret"></span>';
    stat.textContent = '產生中…';
    if (!model) { stat.textContent = '沒有選模型'; return Promise.resolve(); }
    const t0 = performance.now();
    let out = '';
    return chatStream({ model: model, messages: msgs, stream: true, options: opts }, null, {
      think: function () { /* 比較面板不顯示思考過程 */ },
      images: function () { },
      tools: function () { },
      content: function (t) {
        out += t;
        body.innerHTML = renderMarkdown(out);
        body.scrollTop = body.scrollHeight;
      },
      done: function (info) {
        const ec = (info && info.eval_count) || 0, ed = ((info && info.eval_duration) || 0) / 1e9;
        stat.textContent = ec + ' tokens · ' + (ed > 0 ? (ec / ed).toFixed(1) + ' tok/s · ' : '') +
          ((performance.now() - t0) / 1000).toFixed(1) + 's';
      }
    }).catch(function (e) { stat.textContent = friendlyError(e).msg; });
  }));
  $('cmpRun').disabled = false;
}

function errorHint(msg) {
  const m = (msg || '').toLowerCase();
  if (m.indexOf('does not support thinking') >= 0)
    return '這個模型不支援 thinking，請把右側的思考模式切成關閉。';
  if (m.indexOf('not found') >= 0) return '請先下載模型：ollama pull ' + S.model;
  if (m.indexOf('memory') >= 0) return '記憶體不足，試著調小 num_ctx 或改用較小的模型。';
  return '';
}

/* ══════════════════════ 附件 ══════════════════════ */
function extOf(name) {
  const base = String(name || '').toLowerCase();
  const dot = base.lastIndexOf('.');
  return dot < 0 ? base : base.slice(dot + 1);
}

// 文字檔進 context 一律包成 code block：模型比較不會把檔案內容誤讀成指令，
// 縮排與行號也不會被 markdown 吃掉。
function fenceFor(name, text) {
  const lang = EXT_LANG[extOf(name)];
  const tag = lang === undefined ? '' : lang;
  let fence = '```';
  while (text.indexOf(fence) >= 0) fence += '`';   // 內容本身有 ``` 就把圍籬加長
  return '檔案：' + name + '\n' + fence + tag + '\n' + text.replace(/\s+$/, '') + '\n' + fence;
}

function chip(label, onOpen, onRemove) {
  const el = document.createElement('span');
  el.className = 'file-chip' + (onOpen ? ' editable' : '');
  const t = document.createElement('span');
  t.textContent = label;
  if (onOpen) { t.title = '點一下可以看內容或修改'; t.addEventListener('click', onOpen); }
  const x = document.createElement('button');
  x.className = 'x';
  x.textContent = '×';
  x.title = '移除這個附件';
  x.addEventListener('click', onRemove);
  el.appendChild(t);
  el.appendChild(x);
  return el;
}

function renderAttach() {
  const bar = $('attachBar');
  const box = $('attachText');
  const n = S.images.length + S.files.length;
  bar.classList.toggle('show', n > 0);
  box.innerHTML = '';
  S.images.forEach(function (img, i) {
    box.appendChild(chip(img.name, null, function () {
      S.images.splice(i, 1); renderAttach();
    }));
  });
  S.files.forEach(function (f, i) {
    const size = f.text.length > 1000 ? (f.text.length / 1000).toFixed(1) + 'k' : f.text.length;
    box.appendChild(chip(f.name + ' · ' + size + ' 字',
      function () { openFileEditor(i); },
      function () { S.files.splice(i, 1); renderAttach(); }));
  });
  updateCtx();
}

// 貼上或拖進來的內容常常要改一下（刪掉不相干的段落、去掉密碼），
// 只能整個刪掉重來太粗暴。
function openFileEditor(i) {
  const f = S.files[i];
  if (!f) return;
  S.editing = i;
  $('fileName').value = f.name;
  $('fileText').value = f.text;
  $('fileMeta').textContent = f.text.length + ' 字元 · 約 ' + estTokens(f.text) + ' tokens'
    + ' · 送出時會包成 ' + (EXT_LANG[extOf(f.name)] || '無標籤') + ' 的 code block';
  $('fileOverlay').classList.remove('hidden');
  $('fileText').focus();
}

function saveFileEditor() {
  const f = S.files[S.editing];
  if (f) {
    f.name = $('fileName').value.trim() || f.name;
    f.text = $('fileText').value;
    if (!f.text.trim()) S.files.splice(S.editing, 1);      // 清空等於刪掉
  }
  $('fileOverlay').classList.add('hidden');
  renderAttach();
}

async function addFile(file) {
  const ext = extOf(file.name);
  if (/^image\//.test(file.type)) {
    if ((S.caps[S.model] || []).indexOf('vision') < 0) toast('目前模型沒有 vision 能力，圖片可能不會被讀取');
    const data = await new Promise(function (ok) {
      const fr = new FileReader();
      fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); };
      fr.readAsDataURL(file);
    });
    S.images.push({ name: file.name, data: data });
    renderAttach();
    return;
  }
  if (DOC_EXT.indexOf(ext) >= 0) {
    // PDF / Word 這種二進位檔瀏覽器讀不動，交給 serve.py 解析
    if (!S.srv.extract) { toast('解析 ' + ext.toUpperCase() + ' 需要用 serve.py 啟動'); return; }
    toast('解析 ' + file.name + '…');
    const res = await fetch(apiUrl('/extract'), {
      method: 'POST', body: file, headers: { 'X-Filename': encodeURIComponent(file.name) }
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || '解析失敗'); return; }
    if (!(data.text || '').trim()) { toast(file.name + ' 解析結果是空的（可能是掃描檔）'); return; }
    S.files.push({ name: file.name, text: data.text });
    renderAttach();
    return;
  }
  const text = await file.text();
  if (text.indexOf('\u0000') >= 0) { toast(file.name + ' 看起來是二進位檔，略過'); return; }
  S.files.push({ name: file.name, text: text });
  renderAttach();
}

// 貼上一大段文字時猜個副檔名，code block 才標得出語言
function guessExt(text) {
  const head = text.slice(0, 4000);
  const trimmed = text.trim();
  if (/^[{[]/.test(trimmed) && /"\s*:/.test(head)) return 'json';
  if (/^\s*(def |class |import |from \w+ import|print\()/m.test(head)) return 'py';
  if (/\b(function |const |let |=>|console\.log|require\()/.test(head)) return 'js';
  if (/^\s*(SELECT|INSERT INTO|UPDATE |CREATE TABLE)\b/im.test(head)) return 'sql';
  if (/^#!.*\b(bash|sh|zsh)\b|^\s*(sudo|apt|yum|cd|git|docker|curl) /m.test(head)) return 'sh';
  if (/^\s*(#include|int main\s*\()/m.test(head)) return 'c';
  if (/<\/[a-z][\w-]*>/i.test(head)) return 'html';
  if (/^\s*[\w.-]+:\s*\S/m.test(head) && /^\s{2,}\S/m.test(head)) return 'yaml';
  if (/^(#{1,6} |\s*[-*] |\d+\. )/m.test(head)) return 'md';
  return 'txt';
}

function attachPasted(text) {
  S.pasteSeq = (S.pasteSeq || 0) + 1;
  const name = '貼上內容-' + S.pasteSeq + '.' + guessExt(text);
  S.files.push({ name: name, text: text });
  renderAttach();
  toast('貼上的 ' + text.length + ' 個字已收成附件：' + name);
  return name;
}

function pickFiles() {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.addEventListener('change', function () {
    Array.prototype.slice.call(input.files || []).forEach(function (f) {
      addFile(f).catch(function (e) { toast('讀取 ' + f.name + ' 失敗：' + e.message); });
    });
  });
  input.click();
}

/* ══════════════════════ context 用量 ══════════════════════ */
// 粗估：CJK 一字約一 token，其餘約四字元一 token。每次回覆結束後用真實的
// prompt_eval_count 校正 S.ctxRatio，估算就會慢慢貼近該模型的 tokenizer。
// 統一用 K = 1024，跟 num_ctx 欄位同一個單位 —— 兩種 K 混用只會讓人算不清楚
function fmtK(n) {
  const v = Math.max(0, Math.round(n || 0));
  return v < 1024 ? v + ' 個' : (v / 1024).toFixed(1) + 'K';
}

function estTokens(text) {
  const str = String(text || '');
  const cjk = (str.match(/[㐀-鿿豈-﫿぀-ヿ가-힯]/g) || []).length;
  return Math.round(cjk + (str.length - cjk) / 4);
}

function rawEstimate(extra) {
  const c = current();
  let n = estTokens($('system').value);
  if (c) c.messages.forEach(function (m) {
    n += estTokens(m.content) + (m.images ? 800 * m.images.length : 0);
  });
  S.files.forEach(function (f) { n += estTokens(fenceFor(f.name, f.text)); });
  return n + estTokens(extra || '');
}

// num_ctx 欄位（單位 K）換算成 token。允許小數：1.5 就是 1536。
function ctxTokens(raw) {
  const k = parseFloat(String(raw === undefined ? '' : raw).replace(/k$/i, '').trim());
  return isNaN(k) || k <= 0 ? 0 : Math.round(k * 1024);
}

function ctxLimit() { return ctxTokens($('num_ctx').value) || 4096; }

function updateCtx() {
  const limit = ctxLimit();
  const used = Math.round(rawEstimate($('input').value) * S.ctxRatio);
  const pct = Math.min(100, used / limit * 100);
  const tight = used >= limit * 0.75;
  // 「12.3k / 64k（19%）」：用量條與壓縮鍵的提示共用同一份字串
  const nice = function (n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); };
  S.ctxLabel = nice(used) + ' / ' + nice(limit) + '（' + Math.round(used / limit * 100) + '%）';
  $('ctxRow').hidden = used < limit * 0.05;        // 幾乎是空的就不佔版面
  $('ctxRow').style.cursor = tight ? 'pointer' : '';
  $('ctxRow').title = tight ? '點一下壓縮較早的訊息' : '';
  $('ctxFill').style.width = pct + '%';
  $('ctxFill').className = used >= limit ? 'over' : (pct >= 75 ? 'warn' : '');
  // num_ctx 比模型支援的還大時，多出來的部分是假的：Ollama 會默默用模型的上限。
  // 不自動改小（那等於偷改使用者填的數字），但一定要講。
  const cap = S.ctxMax[S.model] || 0;
  const over = cap && limit > cap
    ? ' · ' + (S.model || '這個模型') + ' 最多 ' + Math.round(cap / 1024) + 'K，多填的沒有用'
    : '';
  $('ctxText').textContent = S.ctxLabel +
    (used >= limit ? ' 已超出 num_ctx' : '') + (tight ? ' · 點這裡壓縮' : '') + over;
  $('ctxRow').hidden = $('ctxRow').hidden && !over;      // 只有這個警告時也要看得到
  if (tight) preCompact();      // 快滿了就先在背景把摘要算起來放著
  renderCompactBtns();
}

/* ══════════════════════ 系統提示預設 ══════════════════════ */
function allPresets() {
  return PRESETS.concat(S.presets.map(function (x) { return [x.name, x.text]; }));
}

function openPresetMenu() {
  const items = allPresets().map(function (pair) {
    return {
      label: pair[0],
      meta: pair[1].length > 26 ? pair[1].slice(0, 26) + '…' : pair[1],
      action: function () {
        $('system').value = pair[1];
        S.params.system = pair[1];
        saveConfig(); updateCtx();
        toast('已套用「' + pair[0] + '」');
      }
    };
  });
  items.push('-', { label: '清空系統提示', action: function () {
    $('system').value = ''; S.params.system = ''; saveConfig(); updateCtx();
  } });
  if (S.presets.length) {
    items.push({ label: '刪除自訂預設…', action: function () {
      showMenu($('presetBtn'), S.presets.map(function (x, i) {
        return { label: x.name, action: function () {
          S.presets.splice(i, 1); lsSet(LS_PRESETS, S.presets); toast('已刪除「' + x.name + '」');
        } };
      }));
    } });
  }
  showMenu($('presetBtn'), items);
}

function savePreset() {
  const text = ($('system').value || '').trim();
  if (!text) { toast('系統提示是空的'); return; }
  const name = (prompt('這組預設要叫什麼？', '我的預設') || '').trim();
  if (!name) return;
  S.presets = S.presets.filter(function (x) { return x.name !== name; });
  S.presets.push({ name: name, text: text });
  lsSet(LS_PRESETS, S.presets);
  toast('已存成預設「' + name + '」');
}

/* ══════════════════════ 斜線功能表 ══════════════════════ */
// 打 / 就看得到有哪些功能，不用先去翻選單。skill 選下去會變成一個附件，
// 使用者接著打自己的需求 —— 這樣它跟一般的附件走同一條路，不必另外做機制。
async function loadSkills() {
  if (S.skills) return S.skills;
  try {
    const res = await fetch(apiUrl('/skills'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    });
    const data = await res.json();
    S.skills = data.skills || [];
  } catch (e) { S.skills = []; }
  return S.skills;
}

function slashItems(q) {
  const key = q.toLowerCase();
  const hit = function (name, desc) {
    return !key || (name + ' ' + desc).toLowerCase().indexOf(key) >= 0;
  };
  const cmds = SLASH_CMDS.filter(function (c) { return hit(c[0], c[1]); })
    .map(function (c) { return { kind: '功能', key: c[0], desc: c[1], run: c[2] }; });
  const skills = (S.skills || []).filter(function (s) { return hit(s.name, s.description); })
    .map(function (s) {
      return {
        // 同名時工作區的會蓋掉內建的，所以要看得出來現在用的是哪一份
        kind: 'skill', key: s.name,
        desc: (s.scope === '專案' ? '［專案］' : '') + s.description,
        run: function () { attachSkill(s.name); }
      };
    });
  return cmds.concat(skills);
}

function renderSlash() {
  const bar = $('slashBar');
  const items = S.slash.items;
  bar.hidden = !items.length;
  if (!items.length) return;
  bar.innerHTML = '';
  let kind = '';
  items.forEach(function (it, i) {
    if (it.kind !== kind) {
      kind = it.kind;
      const h = document.createElement('div');
      h.className = 'hd';
      h.textContent = kind === 'skill' ? 'SKILLS（選了會附上它的步驟）'
        : (kind === '檔案' ? '工作區的檔案（選了會附上內容）' : '功能');
      bar.appendChild(h);
    }
    const b = document.createElement('button');
    b.className = 'sc' + (i === S.slash.at ? ' on' : '');
    b.innerHTML = '<span class="k"></span><span class="d"></span>';
    b.querySelector('.k').textContent = (it.prefix || '/') + it.key;
    b.querySelector('.d').textContent = it.desc;
    b.addEventListener('click', function () { runSlash(i); });
    bar.appendChild(b);
  });
}

function slashQuery() {
  const v = $('input').value;
  // 只認「整段訊息就是一個指令」的情況：句子中間的斜線是內容不是指令
  return /^\/[^\s\/]*$/.test(v) ? v.slice(1) : null;
}

// @ 跟 / 不一樣：它是**句子中間**用的（「看一下 @src/app.py 這一段」），
// 所以比對的是游標前的最後一個 @ 詞，不是整段訊息。
function atQuery() {
  const el = $('input');
  const head = el.value.slice(0, el.selectionStart === undefined
    ? el.value.length : el.selectionStart);
  const m = /(?:^|\s)@([^\s@]*)$/.exec(head);
  return m ? m[1] : null;
}

// 檔案清單只拉一次，之後用快取 —— 每打一個字就掃一次工作區太蠢。
async function ensureFileList() {
  if (S.atFiles || !S.ws.path) return;
  S.atFiles = [];                              // 先佔位，免得連打好幾次就發好幾個請求
  try {
    const res = await fetch(apiUrl('/ls'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flat: true })
    });
    const data = await res.json();
    if (res.ok) S.atFiles = data.files || [];
  } catch (e) { /* 拉不到就當作沒有，@ 只是方便，不是必要 */ }
}

function atItems(q) {
  const key = q.toLowerCase();
  const files = S.atFiles || [];
  // 資料夾排在前面：想附整包的人通常打的是資料夾名，不該被同名的檔案洗掉
  const dirs = dirsOf(files)
    .filter(function (d) { return !key || d.toLowerCase().indexOf(key) >= 0; })
    .slice(0, 8)
    .map(function (d) {
      const n = filesUnder(files, d).length;
      return { kind: '資料夾', key: d, prefix: '@', desc: n + ' 個檔案',
               run: function () { attachDir(d); } };
    });
  return dirs.concat(files
    .filter(function (p) { return !key || p.toLowerCase().indexOf(key) >= 0; })
    .slice(0, 30 - dirs.length)
    .map(function (p) {
      const cut = p.lastIndexOf('/');
      return { kind: '檔案', key: p, prefix: '@',
               desc: cut > 0 ? p.slice(0, cut) : '',
               run: function () { attachAt(p); } };
    }));
}

// `@資料夾/`：把底下的檔案一次附上去。**有上限而且會講清楚** ——
// 靜靜截斷的話，使用者會以為模型看得到全部，然後對著缺一半的資料下判斷。
async function attachDir(dir) {
  const all = filesUnder(S.atFiles || [], dir);
  if (!all.length) { toast(dir + ' 底下沒有檔案'); return; }
  insertAtText(dir);
  const take = all.slice(0, AT_DIR_FILES);
  let chars = 0, added = 0;
  const got = await Promise.all(take.map(async function (p) {
    try {
      const res = await fetch(apiUrl('/view'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: p })
      });
      const d = await res.json();
      return res.ok ? { name: p, text: d.text || '' } : null;
    } catch (e) { return null; }
  }));
  got.forEach(function (f) {
    if (!f || chars + f.text.length > AT_DIR_CHARS) return;
    if (S.files.some(function (x) { return x.name === f.name; })) return;
    S.files.push(f); chars += f.text.length; added += 1;
  });
  renderAttach();
  updateCtx();
  const skipped = all.length - added;
  toast('附上 ' + dir + ' 底下 ' + added + ' 個檔案（' + chars.toLocaleString() + ' 字）'
    + (skipped > 0 ? '；還有 ' + skipped + ' 個沒附上（超過上限）' : ''));
  $('input').focus();
}

// 把 @查詢 換成實際的路徑。檔案與資料夾共用。
function insertAtText(text) {
  const el = $('input');
  const at = el.selectionStart === undefined ? el.value.length : el.selectionStart;
  const head = el.value.slice(0, at).replace(/@[^\s@]*$/, '@' + text + ' ');
  el.value = head + el.value.slice(at);
  el.selectionStart = el.selectionEnd = head.length;
  autoGrow();
  updateSlash();
}

// 選了之後：把 @查詢 換成完整路徑（句子讀起來才順），同時把檔案附上去。
// 只插路徑不附內容的話，模型還要再花一輪 read_file。
async function attachAt(path) {
  const el = $('input');
  insertAtText(path);
  try {
    const res = await fetch(apiUrl('/view'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (!S.files.some(function (f) { return f.name === path; })) {
      S.files.push({ name: path, text: data.text || '' });
      renderAttach();
      updateCtx();
    }
  } catch (e) {
    toast('附不上 ' + path + '：' + e.message);
  }
  el.focus();
}

function updateSlash() {
  const at = atQuery();
  if (at !== null) {
    ensureFileList().then(function () {
      if (atQuery() === null) return;          // 等的時候使用者已經打別的了
      S.slash = { items: atItems(atQuery()), at: 0 };
      renderSlash();
    });
    return;
  }
  const q = slashQuery();
  if (q === null) { S.slash = { items: [], at: 0 }; $('slashBar').hidden = true; return; }
  S.slash = { items: slashItems(q), at: 0 };
  renderSlash();
}

function moveSlash(d) {
  const n = S.slash.items.length;
  if (!n) return;
  S.slash.at = (S.slash.at + d + n) % n;
  renderSlash();
  const on = $('slashBar').querySelector('.sc.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
}

function runSlash(i) {
  const it = S.slash.items[i === undefined ? S.slash.at : i];
  if (!it) return;
  // @ 是插在句子中間的，不能把整行清掉 —— 那是 / 指令才對的行為
  if (it.prefix !== '@') {
    $('input').value = '';
    autoGrow();
    updateSlash();
  }
  it.run();
}

async function attachSkill(name) {
  try {
    const res = await fetch(apiUrl('/skills'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    S.files.push({ name: 'skill-' + name + '.md', text: data.body });
    renderAttach();
    updateCtx();
    toast('已附上 ' + name + ' 的步驟，接著描述你要做什麼');
    $('input').focus();
  } catch (e) {
    toast('讀不到這個 skill：' + e.message);
  }
}

/* ══════════════════════ 選單 ══════════════════════ */
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
document.addEventListener('click', function (e) {
  if (openMenu && !openMenu.contains(e.target)) closeMenu();
});

function showMenu(anchor, items) {
  closeMenu();
  const menu = document.createElement('div');
  menu.className = 'menu';
  items.forEach(function (it) {
    if (it === '-') { menu.appendChild(document.createElement('hr')); return; }
    const b = document.createElement('button');
    b.innerHTML = '<span></span>' + (it.meta ? '<span class="m">' + esc(it.meta) + '</span>' : '');
    b.querySelector('span').textContent = (it.checked ? '● ' : '') + it.label;
    // 這一行的 stopPropagation 不能拿掉：底下 document 的「點外面就關」監聽器
    // 會在事件冒泡上去時看到 action() 剛開好的子選單，然後把它關掉
    // （按鈕本身已經被移除，contains(target) 永遠是 false）。
    b.addEventListener('click', function (e) { e.stopPropagation(); closeMenu(); it.action(); });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  // 按鈕在畫面下半部時（輸入框旁邊那幾個），往下開會整個掉到視窗外
  const h = menu.offsetHeight;
  const below = window.innerHeight - r.bottom - 12;
  menu.style.top = (h <= below || r.top < h + 12
    ? r.bottom + 6
    : Math.max(8, r.top - h - 6)) + 'px';
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - menu.offsetWidth - 12)) + 'px';
  menu.style.maxHeight = Math.max(160, window.innerHeight - 24) + 'px';
  openMenu = menu;
}

// 匯出檔用的 Markdown：跟畫面上那份共用 blockMd，但 code block 換成乾淨的
// <pre><code> —— 介面版帶著複製按鈕與 data-code，那些在匯出檔裡是死的。
function exportMd(src) {
  const re = /```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += blockMd(src.slice(last, m.index));
    out += '<pre><code>' + esc(m[2].replace(/\n$/, '')) + '</code></pre>';
    last = m.index + m[0].length;
  }
  return out + blockMd(src.slice(last));
}

// 單一 HTML：不連任何外部資源，寄給別人或存檔都能直接打開。
// 版面是聊天室的樣子 —— 模型靠左、你靠右。匯出檔常常是拿去給別人看的，
// 「誰說了什麼」要能一眼掃過去，不用讀每一行的名字。
// 樣式刻意寫死一份簡單的，不從主程式搬 —— 匯出檔的壽命比介面長很多。
function exportHtml(c) {
  const rows = c.messages.map(function (m) {
    if (m.role === 'tool') {
      // 工具往返跟著模型那一側，預設收起來：它是過程不是對話
      return '<div class="row left"><details class="tool"><summary>🔧 ' +
        esc(m.tool_name || '') +
        (m.denied ? '（已略過）' : (m.failed ? '（失敗）' : '')) + '</summary><pre>' +
        esc((m.args ? JSON.stringify(m.args, null, 2) + '\n\n' : '') + (m.content || '')) +
        '</pre></details></div>';
    }
    const mine = m.role === 'user';
    const who = mine ? '你' : (m.model || 'assistant');
    const think = m.thinking
      ? '<details class="think"><summary>思考過程</summary><pre>' + esc(m.thinking) +
        '</pre></details>' : '';
    return '<div class="row ' + (mine ? 'right' : 'left') + '">' +
      '<div class="bub"><div class="who">' + esc(who) + '</div>' +
      think + '<div class="body">' + exportMd(m.content || '') + '</div></div></div>';
  }).join('\n');

  return '<!doctype html>\n<html lang="zh-Hant"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(c.title) + '</title><style>' +
    'body{max-width:860px;margin:0 auto;padding:28px 18px;' +
    'font:15px/1.75 system-ui,-apple-system,"Noto Sans TC",sans-serif;' +
    'background:#faf9f7;color:#22201d;}' +
    'h1{font-size:19px;margin:0 0 4px;}.meta{color:#8b857c;font-size:12px;margin-bottom:26px;}' +
    '.row{display:flex;margin:0 0 16px;}' +
    '.row.left{justify-content:flex-start;}.row.right{justify-content:flex-end;}' +
    '.bub{max-width:78%;border-radius:14px;padding:9px 14px;' +
    'background:#fff;border:1px solid #e7e3dc;}' +
    '.row.right .bub{background:#eef1fb;border-color:#dce1f5;}' +
    '.who{font-size:11.5px;font-weight:600;color:#8b857c;margin-bottom:4px;}' +
    '.row.right .who{text-align:right;}' +
    '.body>*:first-child{margin-top:0;}.body>*:last-child{margin-bottom:0;}' +
    'pre{background:#f2efe9;border:1px solid #e7e3dc;border-radius:8px;padding:11px 13px;' +
    'overflow-x:auto;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;}' +
    'code{background:#f2efe9;padding:1px 4px;border-radius:4px;' +
    'font:.9em ui-monospace,Menlo,Consolas,monospace;}' +
    'pre code{background:none;padding:0;}' +
    'details{margin:6px 0;}summary{cursor:pointer;color:#8b857c;font-size:12.5px;}' +
    '.row .tool{max-width:78%;background:#fff;border:1px solid #e7e3dc;' +
    'border-radius:12px;padding:7px 13px;}' +
    '.tool summary{color:#7c5cf0;}' +
    '@media(max-width:620px){.bub,.row .tool{max-width:92%;}}' +
    '@media(prefers-color-scheme:dark){body{background:#191714;color:#e8e4dc;}' +
    '.bub,.row .tool,pre,code{background:#221f1b;border-color:#332f28;}' +
    '.row.right .bub{background:#232637;border-color:#343a52;}}' +
    '</style></head><body>' +
    '<h1>' + esc(c.title) + '</h1>' +
    '<div class="meta">模型：' + esc(c.model || '') + ' · 匯出於 ' +
    esc(new Date().toLocaleString()) + ' · ZackLLMGUI</div>' +

function exportChat(fmt) {
  const c = current();
  if (!c || !c.messages.length) { toast('這個對話還沒有內容'); return; }
  let text, mime, ext;
  if (fmt === 'html') {
    text = exportHtml(c); mime = 'text/html'; ext = '.html';
  } else if (fmt === 'json') {
    text = JSON.stringify(c, null, 2); mime = 'application/json'; ext = '.json';
  } else {
    const lines = ['# ' + c.title, '', '> 模型：' + (c.model || ''), ''];
    c.messages.forEach(function (m) {
      lines.push('## ' + (m.role === 'user' ? '你' : (m.model || 'assistant')), '');
      if (m.thinking) lines.push('<details><summary>思考過程</summary>', '', m.thinking, '', '</details>', '');
      lines.push(m.content, '');
    });
    text = lines.join('\n'); mime = 'text/markdown'; ext = '.md';
  }
  const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = c.title.replace(/[\\/:*?"<>|]/g, '_') + ext;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ══════════════════════ 側欄拖寬 ══════════════════════ */
// 上下限只寫在 CSS 的 min-width / max-width，這裡讀回來用 —— 兩邊各寫一份
// 遲早會對不上，而且「拖到某個寬度按鈕就跑版」是使用者第一個會踩到的事。
function sideWidthLimits(aside) {
  const cs = getComputedStyle(aside);
  const min = parseFloat(cs.minWidth) || 190;
  const max = parseFloat(cs.maxWidth) || (innerWidth * 0.7);
  // 再留 360px 給中間的對話區，不然兩側可以把它擠到不能用
  return [min, Math.max(min, Math.min(max, innerWidth - 360))];
}

function wireResizer(handle, aside, varName, grows) {
  if (!handle || !aside) return;
  handle.addEventListener('pointerdown', function (e) {
    if (e.button) return;                        // 只理會左鍵
    e.preventDefault();
    const startX = e.clientX;
    const startW = aside.getBoundingClientRect().width;
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('dragging');
    document.body.classList.add('resizing');

    const move = function (ev) {
      // 左側欄往右拖是變寬，右側欄相反
      const delta = grows === 'right' ? ev.clientX - startX : startX - ev.clientX;
      const lim = sideWidthLimits(aside);
      const w = Math.max(lim[0], Math.min(lim[1], startW + delta));
      document.documentElement.style.setProperty(varName, w + 'px');
    };
    const up = function () {
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing');
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      saveConfig();                              // 拖完才存，不是拖的每一格都存
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
  // 雙擊還原成預設寬度：拖歪了不必自己慢慢喬回去
  handle.addEventListener('dblclick', function () {
    document.documentElement.style.removeProperty(varName);
    saveConfig();
  });
}

// 存回去的寬度也要夾一次：視窗換了一台螢幕（或使用者改了 CSS）之後，
// 上次那個寬度可能已經超出這台的上限。
function applySideWidth(varName, aside, px) {
  if (!(+px > 0) || !aside) return;
  const lim = sideWidthLimits(aside);
  document.documentElement.style.setProperty(
    varName, Math.max(lim[0], Math.min(lim[1], +px)) + 'px');
}

function savedSideWidth(varName) {
  const v = document.documentElement.style.getPropertyValue(varName);
  return v ? parseFloat(v) : 0;
}

function renderSysBar() {
  const bar = $('sysBar');
  const shown = S.sys ? sysShown() : [];
  bar.hidden = !shown.length;
  if (!shown.length) return;
  bar.innerHTML = shown.map(function (m) {
    const c = sysCell(m[0], S.sys);
    return '<span class="m ' + sysLevel(c.at) + '"><span>' + m[1] +
      '</span><b>' + esc(c.text) + '</b></span>';
  }).join('');
}

function sysRow(k, v, at) {
  return '<div><div class="row"><span class="k">' + esc(k) + '</span>' +
    '<span class="v">' + esc(v) + '</span></div>' +
    (typeof at === 'number'
      ? '<div class="bar ' + sysLevel(at) + '"><i style="width:' +
        Math.min(100, Math.max(0, at * 100)).toFixed(0) + '%"></i></div>'
      : '') + '</div>';
}

function renderSysFull() {
  const d = S.sys, box = $('sysFull');
  if (!d) { box.textContent = '拿不到系統用量（只有本機開的頁面看得到）。'; return; }
  const rows = [];
  (d.gpu || []).forEach(function (g, i) {
    const tag = (d.gpu.length > 1 ? '#' + i + ' ' : '') + g.name;
    if (g.vram && g.vram.total) {
      rows.push(sysRow(tag + '　VRAM',
        g.vram.used.toFixed(1) + ' / ' + g.vram.total.toFixed(1) + ' GB',
        g.vram.used / g.vram.total));
    }
    rows.push(sysRow(tag + '　使用率', g.util + '%　' + g.temp + '°C', g.util / 100));
  });
  if (d.ram && d.ram.total) {
    rows.push(sysRow('RAM', d.ram.used.toFixed(1) + ' / ' + d.ram.total.toFixed(1) + ' GB',
      d.ram.used / d.ram.total));
  }
  if (typeof d.cpu === 'number' && d.cpu >= 0) {
    rows.push(sysRow('CPU（' + d.cores + ' 核）', d.cpu.toFixed(0) + '%', d.cpu / 100));
  }
  if (!d.gpu || !d.gpu.length) {
    rows.push('<div class="note">找不到 nvidia-smi，所以沒有 GPU 與 VRAM 那幾格。</div>');
  }
  (S.sysModels || []).forEach(function (m) {
    rows.push(sysRow('載入中：' + m.name,
      (m.size_vram ? (m.size_vram / 1073741824).toFixed(1) + ' GB 在 VRAM' : '在 CPU')));
  });
  box.innerHTML = rows.join('');
  $('sysWhere').textContent = d.ollama_local
    ? '這些是 serve.py 這台機器的數字，Ollama 也在同一台。'
    : 'Ollama 不在這台機器上 —— GPU 與 VRAM 講的是 serve.py 這台的卡，不是跑模型的那張。';
}

function renderSysPick() {
  $('sysPick').innerHTML = SYS_METRICS.map(function (m) {
    const has = !!sysCell(m[0], S.sys);
    return '<label class="check" title="' + esc(m[2]) + '">' +
      '<input type="checkbox" data-sys="' + m[0] + '"' +
      (S.sysChips.indexOf(m[0]) >= 0 ? ' checked' : '') +
      (has ? '' : ' disabled') + '>' + m[1] + (has ? '' : '（這台拿不到）') + '</label>';
  }).join('');
  $('sysPick').querySelectorAll('input[data-sys]').forEach(function (el) {
    el.addEventListener('change', function () {
      const id = el.getAttribute('data-sys');
      S.sysChips = SYS_METRICS.map(function (m) { return m[0]; }).filter(function (x) {
        return x === id ? el.checked : S.sysChips.indexOf(x) >= 0;
      });
      saveConfig();
      renderSysBar();
    });
  });
}

async function openSys() {
  $('sysOverlay').classList.remove('hidden');
  renderSysFull();
  renderSysPick();
  try {                                     // 哪個模型正佔著 VRAM，Ollama 自己知道
    const res = await fetch(apiUrl('/api/ps'));
    S.sysModels = res.ok ? ((await res.json()).models || []) : [];
  } catch (e) { S.sysModels = []; }
  renderSysFull();
}
