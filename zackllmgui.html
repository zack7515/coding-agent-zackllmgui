<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZackLLMGUI</title>
<!-- 這個檔案是 frontend/index.html 的產出，不要直接改它。
     改 frontend/ 底下的檔案，serve.py 啟動或重新整理時會自己重組（或跑 python build.py）。 -->
<style>
/* ═══════════════ 色票 ═══════════════ */
:root{
  /* 閱讀區的字體倍率。一定要放在 :root —— 放 body 的話，body 自己的宣告
     會贏過從 :root 繼承下來的值，JS 怎麼設都沒有用（踩過）。 */
  --fs:1;
  --ground:#0d0f12; --surface:#141619; --raised:#1b1e23; --hover:#22262d;
  --line:#23272e; --line2:#31363e;
  --ink:#e9ebee; --ink2:#a3aab4; --ink3:#6d7580;
  --accent:#5b95f7; --accent-ink:#0d0f12;
  --think:#a78bff; --think-bg:#17151f; --think-line:#2c2640; --think-ink:#b9a6f5;
  --think-dim:#8b8399; --think-sel:#2f2a45; --think-sel-ink:#c4b5fd;
  --ok:#3ddc97; --warn:#f5b544; --err:#ff6b6b;
  --err-bg:#1a1315; --err-line:#3a2529; --err-ink:#ffc4c4;
  --code-bg:#0a0c0e; --code-head:#111417; --code-ink:#c8cdd4; --inline-bg:#20242b;
  --composer-bg:#16191e; --composer-line:#2c313a; --scroll:#2a2f37;
  --syn-kw:#c792ea; --syn-str:#9ece6a; --syn-fn:#7aa2f7; --syn-com:#565f6b; --syn-num:#f5b544;
  --ui:'Segoe UI Variable Text','Segoe UI','Microsoft JhengHei UI',system-ui,sans-serif;
  --mono:'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace;
}
[data-theme="light"]{
  --ground:#ffffff; --surface:#f7f8fa; --raised:#eef0f3; --hover:#e4e7ec;
  --line:#dcdfe4; --line2:#c9ced6;
  --ink:#1a1d21; --ink2:#4d545d; --ink3:#7b828c;
  --accent:#2f6fe0; --accent-ink:#ffffff;
  --think:#7c5cf0; --think-bg:#f5f2fe; --think-line:#ddd4fb; --think-ink:#5b3fc4;
  --think-dim:#6f6689; --think-sel:#e5dcfd; --think-sel-ink:#4c2fb8;
  --ok:#12a05f; --warn:#a8700a; --err:#d13b3b;
  --err-bg:#fdf3f3; --err-line:#f0cfcf; --err-ink:#8f2626;
  --code-bg:#f5f6f8; --code-head:#eceef2; --code-ink:#2b2f36; --inline-bg:#eceef2;
  --composer-bg:#ffffff; --composer-line:#c9ced6; --scroll:#c9ced6;
  --syn-kw:#8b34c4; --syn-str:#1f7a3d; --syn-fn:#2255c7; --syn-com:#8b929b; --syn-num:#a8700a;
}

*{box-sizing:border-box;}
/* class 上的 display 會蓋掉瀏覽器預設的 [hidden]{display:none}，要補回來 */
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer;}
input,textarea{font-family:inherit; font-size:inherit; color:inherit;}
svg{display:block; flex:none;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--line2);}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

#app{display:flex; height:100%; position:relative;}

/* ═══════════════ 側欄 ═══════════════ */
#sidebar{
  width:var(--side-w,260px); flex:0 0 var(--side-w,260px);
  min-width:190px; max-width:70vw; position:relative;
  background:var(--surface);
  border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;
}
.side-head{
  height:56px; flex:0 0 56px; display:flex; align-items:center; gap:10px;
  padding:0 10px 0 14px; border-bottom:1px solid var(--line);
}
.app-name{font-size:14px; font-weight:600; letter-spacing:-.01em; flex:1; min-width:0;}
.side-top{padding:12px; display:flex; flex-direction:column; gap:8px;}
.btn-new{
  height:36px; border-radius:10px; background:var(--raised); border:1px solid var(--line2);
  display:flex; align-items:center; gap:8px; padding:0 12px; font-weight:500; width:100%;
}
.btn-new:hover{background:var(--hover);}
.btn-new .kbd{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink3);}
.search{
  height:32px; border-radius:8px; background:var(--ground); border:1px solid var(--line);
  padding:0 10px 0 32px; width:100%; outline:none;
}
.search:focus{border-color:var(--accent);}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute; left:10px; top:9px; color:var(--ink3);}
.side-label{
  padding:10px 20px 6px; font-size:11px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink3);
}
#chatList{flex:1; min-height:0; overflow-y:auto; padding:0 8px 8px; display:flex; flex-direction:column; gap:2px;}
.chat-item{
  min-height:34px; border-radius:8px; display:flex; align-items:center; gap:8px;
  padding:6px 8px 6px 10px; color:var(--ink2); border-left:3px solid transparent;
  cursor:pointer; background:none; border-top:0; border-right:0; border-bottom:0; text-align:left; width:100%;
}
.chat-item:hover{background:var(--hover);}
.chat-item.active{background:var(--hover); color:var(--ink); border-left-color:var(--accent);}
.chat-item .t{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chat-item .del,.chat-item .ren{
  opacity:0; color:var(--ink3); display:flex; padding:2px; border-radius:4px;
}
.chat-item:hover .del,.chat-item:hover .ren{opacity:1;}
.chat-item .del:hover{color:var(--err);}
.chat-item .ren:hover{color:var(--accent);}
.side-foot{
  border-top:1px solid var(--line); padding:10px 10px 10px 12px;
  display:flex; align-items:center; gap:10px;
}
.avatar{
  width:26px; height:26px; border-radius:999px; background:var(--hover); color:var(--ink2);
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex:none;
  border:1px solid transparent; cursor:pointer; padding:0;
}
.avatar:hover{border-color:var(--line2); color:var(--ink);}
.side-foot .meta{flex:1; min-width:0;}
.side-foot .h{font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.side-foot .s{font-size:11px; color:var(--ink3); font-family:var(--mono);}

/* ═══════════════ 主區 ═══════════════ */
#main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--ground);}
#topbar{
  height:56px; flex:0 0 56px; display:flex; align-items:center; gap:12px;
  padding:0 16px 0 20px; border-bottom:1px solid var(--line); min-width:0;
}
/* 空間不夠時先犧牲模型名與狀態列的細節，最後才輪到按鈕；
   ⋯ 與狀態燈是出口，被擠掉就沒辦法設定了 */
#topbar > .icon-btn{flex:none;}
#topbar .cap{display:none;}
@media (min-width:880px){ #topbar .cap{display:flex;} }
.model-btn{
  height:32px; border-radius:8px; background:var(--raised); border:1px solid var(--line2);
  display:flex; align-items:center; gap:9px; padding:0 10px 0 12px; font-weight:600;
  letter-spacing:-.01em; max-width:360px; color:var(--ink);
  min-width:80px; flex:0 1 auto; overflow:hidden;
}
.model-btn:hover{background:var(--hover);}
.model-btn .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.size-chip{
  height:18px; padding:0 6px; border-radius:5px; background:var(--line2); color:var(--ink2);
  font-size:10.5px; font-weight:600; display:flex; align-items:center; flex:none;
}
.cap{
  height:22px; padding:0 8px; border-radius:6px; font-size:11px; font-weight:600;
  display:flex; align-items:center; gap:5px; flex:none;
}
/* 修飾詞刻意加 cap- 前綴：叫 .think 會和下面思考區塊的 .think 撞名，
   單一 class 選擇器權重相同，後面那條的 border-radius 與 border 會蓋過來。 */
.cap.cap-think{background:var(--think-bg); color:var(--think);}
.cap.cap-tools{background:var(--surface); color:var(--ok);}
.cap.cap-vision{background:var(--surface); color:var(--accent);}
.spacer{flex:1;}

/* 連線狀態 */
#statusPill{
  height:30px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:0 12px 0 11px;
  flex:0 1 auto; min-width:0; overflow:hidden;
}
@media (max-width:700px){
  #statusHost, .pill-sep{display:none;}      /* 位址讓位，燈號與狀態字留著 */
  .size-chip{display:none;}
}
#statusPill:hover{border-color:var(--line2);}
#statusPill.error{background:var(--err-bg); border-color:var(--err-line); padding-right:5px;}
.dot{width:7px; height:7px; border-radius:999px; flex:none;}
.dot.ok{background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);}
.dot.connecting{background:var(--warn); box-shadow:0 0 0 4px color-mix(in srgb, var(--warn) 16%, transparent); animation:breathe 1.4s ease-in-out infinite;}
.dot.error{background:var(--err); box-shadow:0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent);}
.dot.idle{background:var(--ink3);}
@keyframes breathe{0%,100%{opacity:.45;}50%{opacity:1;}}
@media (prefers-reduced-motion:reduce){.dot.connecting{animation:none;}}
#statusText{font-size:12px; font-weight:500; white-space:nowrap;}
#statusPill.error #statusText{color:var(--err-ink);}
.pill-sep{width:1px; height:13px; background:var(--line2); flex:none;}
#statusHost{font-size:11px; color:var(--ink3); font-family:var(--mono); white-space:nowrap;}
#retryBtn{
  height:22px; border-radius:999px; background:color-mix(in srgb, var(--err) 22%, transparent);
  border:0; color:var(--err-ink); font-size:11px; font-weight:600;
  display:none; align-items:center; gap:5px; padding:0 9px; flex:none;
}
#statusPill.error #retryBtn{display:flex;}

.icon-btn{
  width:32px; height:32px; border-radius:8px; background:none; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--ink2); flex:none;
}
.icon-btn:hover{background:var(--hover);}
.icon-btn.flat{border-color:transparent;}
.icon-btn:disabled{color:var(--ink3); opacity:.5; cursor:not-allowed;}

/* 訊息串 */
#scroll{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;}
#thread{max-width:720px; margin:0 auto; padding:24px 24px 8px; display:flex; flex-direction:column; gap:22px;}
.msg{display:flex; gap:12px;}
.msg.user{justify-content:flex-end;}
.bubble{
  max-width:76%; background:var(--hover); border-radius:18px 18px 4px 18px;
  padding:10px 15px; font-size:calc(14px * var(--fs)); line-height:1.6;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.msg-avatar{
  width:28px; height:28px; flex:0 0 28px; border-radius:999px; background:var(--raised);
  border:1px solid var(--line2); display:flex; align-items:center; justify-content:center;
  color:var(--accent); margin-top:2px;
}
.msg-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:9px;}
.msg-name{font-size:12.5px; font-weight:600;}
.msg-body{font-size:calc(14px * var(--fs)); line-height:1.7; color:var(--ink); overflow-wrap:anywhere;}
.msg-body p{margin:0 0 .7em;}
.msg-body p:last-child{margin-bottom:0;}
.msg-body h1,.msg-body h2,.msg-body h3{font-size:15px; margin:.2em 0 .5em;}
.msg-body ul,.msg-body ol{margin:.2em 0 .7em; padding-left:1.4em;}
.msg-body li{margin:.15em 0;}
.msg-body a{color:var(--accent);}
.msg-body code{
  font-family:var(--mono); font-size:calc(12.5px * var(--fs)); background:var(--inline-bg);
  border-radius:4px; padding:1px 5px;
}
.msg-foot{display:flex; align-items:center; gap:10px; min-height:24px;}
.stats{font-size:11px; color:var(--ink3); font-family:var(--mono); overflow-wrap:anywhere;}
.msg-actions{margin-left:auto; display:flex; gap:4px;}
.msg-actions .icon-btn{width:24px; height:24px; border-color:transparent; color:var(--ink3);}
.caret{
  display:inline-block; width:2px; height:15px; background:var(--accent);
  vertical-align:-3px; margin-left:2px; animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0;}}
/* 等第一個字的時候畫的那一行。只有一個游標閃在空白畫面上看起來就是當掉了：
   num_ctx 大的時候光 prefill 就要幾十秒，思考模式又把字全吐在 think 裡。 */
.wait{color:var(--ink2); font-size:13px; animation:breathe 1.6s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.wait{animation:none;}}

/* 程式碼區塊 */
.code{border-radius:12px; border:1px solid var(--line); overflow:hidden; background:var(--code-bg); margin:.2em 0;}
.code-head{
  height:30px; background:var(--code-head); border-bottom:1px solid var(--line);
  display:flex; align-items:center; padding:0 8px 0 12px; gap:8px;
}
.code-lang{font-size:11px; color:var(--ink3); font-family:var(--mono); flex:1;}
.code-copy{width:24px; height:24px; border:0; background:none; border-radius:6px; color:var(--ink3); display:flex; align-items:center; justify-content:center;}
.code-copy:hover{background:var(--hover);}
.code pre{
  margin:0; padding:12px 14px; overflow-x:auto; font-family:var(--mono);
  font-size:calc(12.5px * var(--fs)); line-height:1.75; color:var(--code-ink);
}
.k{color:var(--syn-kw);} .s{color:var(--syn-str);} .f{color:var(--syn-fn);}
.c{color:var(--syn-com);} .n{color:var(--syn-num);}

/* 思考區塊 */
.think{border-radius:12px; background:var(--think-bg); border:1px solid var(--think-line); overflow:hidden; align-self:flex-start; max-width:100%;}
.think.open{align-self:stretch;}
.think-head{
  height:32px; display:flex; align-items:center; gap:7px; padding:0 12px;
  color:var(--think-ink); font-size:11.5px; font-weight:500; background:none; border:0; width:100%;
}
.think-head svg:first-child{color:var(--think);}
.think-head .chev{color:var(--think-dim); margin-left:auto;}
.think.open .think-head{border-bottom:1px solid var(--think-line);}
.think-dots{display:flex; gap:3px; align-items:center;}
.think-dots i{width:3px; height:3px; border-radius:999px; background:var(--think-dim); animation:pulse 1.2s ease-in-out infinite;}
.think-dots i:nth-child(2){animation-delay:.2s;} .think-dots i:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
.think-body{
  padding:11px 14px; font-size:calc(12.5px * var(--fs)); line-height:1.75; color:var(--think-dim);
  font-style:italic; white-space:pre-wrap; overflow-wrap:anywhere; display:none;
}
.think.open .think-body{display:block;}

/* 錯誤卡 */
.err-card{
  background:var(--err-bg); border:1px solid var(--err-line); border-radius:12px;
  padding:13px 15px; display:flex; gap:13px;
}
.err-card .ic{color:var(--err); margin-top:1px;}
.err-card .t{font-size:13px; font-weight:600; color:var(--err-ink); overflow-wrap:anywhere;}
.err-card .d{font-size:12px; color:var(--ink2); margin-top:3px; white-space:pre-wrap;}

.empty{color:var(--ink3); text-align:center; padding:60px 20px; font-size:13.5px; line-height:1.9;}

/* 輸入區 */
#composerWrap{flex:none; padding:8px 0 18px;}
#composer{
  max-width:720px; margin:0 auto; background:var(--composer-bg); border:1px solid var(--composer-line);
  border-radius:20px; padding:12px 12px 10px 16px; display:flex; flex-direction:column; gap:10px;
}
#composerWrap{padding-left:24px; padding-right:24px;}
#input{
  background:none; border:0; outline:none; resize:none; width:100%;
  font-size:calc(14px * var(--fs)); line-height:1.5; min-height:24px;
  max-height:170px; overflow-y:auto; color:var(--ink);
}
#input::placeholder{color:var(--ink3);}
#input:disabled{color:var(--ink3);}
.comp-row{display:flex; align-items:center; gap:8px;}
.comp-row .icon-btn{width:30px; height:30px; border-color:var(--composer-line);}
.comp-row .icon-btn.on{
  background:var(--think-sel); border-color:var(--think-line); color:var(--think-ink);
}
/* 自動模式開著就換成警告色：這件事必須一眼看得到 */
.comp-row .icon-btn.warn{
  background:var(--err-bg); border-color:var(--err-line); color:var(--err);
}
.hint{font-size:11px; color:var(--ink3); margin-left:auto; white-space:nowrap;}
#sendBtn{
  width:34px; height:34px; border-radius:999px; background:var(--accent); border:0;
  color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;
}
#sendBtn:disabled{background:var(--line); color:var(--ink3); cursor:not-allowed;}
#sendBtn.stop{background:var(--err); color:var(--err-bg);}
#attachBar{font-size:11px; color:var(--ink3); display:none; gap:8px; align-items:center;}
#attachBar.show{display:flex;}
#attachBar button{background:none; border:0; color:var(--ink3); text-decoration:underline;}

/* ═══════════════ 參數面板 ═══════════════ */
#params{
  width:var(--params-w,320px); flex:0 0 var(--params-w,320px);
  /* 280 是量出來的：#pBody 是兩欄格線，最長的參數名 draft_num_predict
     在這個寬度以下會撐出欄外。下面 .f-label 的 overflow-wrap 是保險，
     擋的是以後冒出更長的名字 —— 兩道都要，一道是好看、一道是保證。 */
  min-width:280px; max-width:70vw; position:relative;
  background:var(--surface); border-left:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden;
}
.p-head{
  height:56px; flex:0 0 56px; display:flex; align-items:center; gap:8px;
  padding:0 12px 0 16px; border-bottom:1px solid var(--line);
}
.p-title{font-size:14px; font-weight:600; flex:1;}
.ghost{
  height:26px; border-radius:7px; background:none; border:1px solid var(--line2);
  color:var(--ink2); font-size:11.5px; display:flex; align-items:center; gap:6px; padding:0 9px;
}
.ghost:hover{background:var(--hover);}
#pBody{flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:18px;}
.sec{display:flex; flex-direction:column; gap:9px;}
.sec-label{
  font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink3); display:flex; align-items:center; gap:7px;
}
.sec-label svg{color:var(--think);}
.divider{height:1px; background:var(--line);}
.note{font-size:11px; line-height:1.55; color:var(--ink3);}

.seg{
  height:32px; border-radius:9px; background:var(--ground); border:1px solid var(--line);
  padding:3px; display:flex; gap:3px;
}
.seg button{
  flex:1; border-radius:6px; background:none; border:0; color:var(--ink2);
  font-size:12px; display:flex; align-items:center; justify-content:center;
}
.seg button:hover:not(.on):not(:disabled){background:var(--hover);}
.seg button.on{background:var(--think-sel); color:var(--think-sel-ink); font-weight:600;}
.seg button:disabled{color:var(--ink3); cursor:not-allowed;}
.seg.disabled{opacity:.55;}

.check{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink2); cursor:pointer;}
.check input{
  appearance:none; width:16px; height:16px; border-radius:4px; border:1px solid var(--line2);
  background:var(--ground); flex:none; position:relative; cursor:pointer; margin:0;
}
.check input:checked{background:var(--think); border-color:var(--think);}
.check input:checked::after{
  content:''; position:absolute; left:5px; top:2px; width:4px; height:8px;
  border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(45deg);
}
[data-theme="light"] .check input:checked::after{border-color:#fff;}

textarea.field{
  background:var(--ground); border:1px solid var(--line); border-radius:10px;
  padding:9px 11px; font-size:12.5px; line-height:1.6; resize:vertical; min-height:68px; outline:none; width:100%;
}
textarea.field:focus,input.field:focus{border-color:var(--accent);}
input.field{
  height:30px; background:var(--ground); border:1px solid var(--line); border-radius:8px;
  padding:0 10px; font-family:var(--mono); font-size:12px; outline:none; width:100%;
}
.slider-row{display:flex; flex-direction:column; gap:7px;}
.slider-top{display:flex; align-items:center;}
.slider-top .l{flex:1; font-size:12.5px; color:var(--ink2);}
.badge{
  height:20px; width:52px; padding:0 6px; border-radius:5px; background:var(--raised);
  border:1px solid var(--line2); color:var(--ink); text-align:center;
  font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums;
  outline:none; flex:none;
}
.badge:hover{border-color:var(--ink3);}
.badge:focus{border-color:var(--accent);}
input[type=range]{
  appearance:none; width:100%; height:4px; border-radius:999px; background:var(--line); outline:none; margin:4px 0;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none; width:13px; height:13px; border-radius:999px;
  background:var(--ink); border:3px solid var(--accent); cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:999px; background:var(--ink);
  border:3px solid var(--accent); cursor:pointer;
}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px;}
.f-label{font-size:11px; color:var(--ink3); font-family:var(--mono); margin-bottom:5px; display:block; overflow-wrap:anywhere;}

/* ═══════════════ 對話框 ═══════════════ */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.overlay.hidden{display:none;}
/* 說明是從別的對話框裡點開的，DOM 順序在它們前面，不墊高就會被蓋住 */
#phOverlay{z-index:60;}
.dialog{
  width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line2);
  border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 18px 48px rgba(0,0,0,.45);
}
.dialog h2{margin:0; font-size:15px; font-weight:600;}
/* 路徑、模型名這類長字串沒有空白可以斷行，不強制斷就會把對話框撐爆 */
.dialog, .dialog .note, .dialog-row span{min-width:0; overflow-wrap:anywhere;}
.dialog .note code{overflow-wrap:anywhere;}
.dialog-row > span{flex:1 1 auto;}
.dialog input:not([type="checkbox"]){
  height:34px; background:var(--ground); border:1px solid var(--line2); border-radius:9px;
  padding:0 11px; font-family:var(--mono); font-size:12.5px; outline:none; width:100%;
}
.dialog input:not([type="checkbox"]):focus{border-color:var(--accent);}
/* 核取方塊沿用 .check 的樣式，不要被上面那條吃掉 */
.dialog .check{align-items:flex-start; line-height:1.55;}
.dialog .check input{margin-top:2px;}
.primary{
  height:30px; border-radius:8px; background:var(--accent); border:0; color:var(--accent-ink);
  font-size:12px; font-weight:600; padding:0 14px; display:flex; align-items:center; gap:6px;
}
.dialog-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
#hostResult{font-size:12px;}
.dialog-actions{display:flex; justify-content:flex-end; gap:9px; margin-top:2px;}
.menu{
  position:absolute; z-index:60; background:var(--surface); border:1px solid var(--line2);
  border-radius:10px; padding:5px; min-width:230px; max-height:400px; overflow-y:auto;
  box-shadow:0 12px 32px rgba(0,0,0,.4);
}
.menu button{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
  border:0; border-radius:6px; padding:7px 10px; font-size:12.5px; color:var(--ink);
}
.menu button:hover{background:var(--hover);}
.menu button .m{
  margin-left:auto; color:var(--ink3); font-size:11px; font-family:var(--mono);
  max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.menu button > span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px;}
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--raised); border:1px solid var(--line2); border-radius:9px;
  padding:8px 14px; font-size:12.5px; z-index:80; opacity:0; pointer-events:none;
  transition:opacity .18s;
}
#toast.show{opacity:1;}

/* ═══════════════ context 用量 ═══════════════ */
#todoBar{
  display:flex; flex-direction:column; gap:2px; padding:6px 8px; margin-bottom:6px;
  background:var(--ground); border:1px solid var(--line); border-radius:8px;
  max-height:132px; overflow-y:auto; font-size:11.5px;
}
#todoBar .t{display:flex; gap:7px; align-items:flex-start; color:var(--ink2);}
#todoBar .t.done{color:var(--ink3); text-decoration:line-through;}
#todoBar .t .b{color:var(--accent); flex:none;}
#todoBar .t.done .b{color:var(--ok);}
#todoBar .h{font-size:10.5px; color:var(--ink3); letter-spacing:.04em;}
/* 打 / 之後浮在輸入框上面的功能清單 */
#slashBar{
  display:flex; flex-direction:column; gap:1px; padding:5px; margin-bottom:6px;
  background:var(--raised); border:1px solid var(--line2); border-radius:9px;
  max-height:230px; overflow-y:auto;
}
#slashBar .sc{
  display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:6px;
  cursor:pointer; font-size:12.5px; color:var(--ink2); border:0; background:none;
  width:100%; text-align:left;
}
#slashBar .sc.on,#slashBar .sc:hover{background:var(--hover); color:var(--ink);}
#slashBar .sc .k{font-family:var(--mono); color:var(--accent); flex:none;}
#slashBar .sc .d{
  color:var(--ink3); font-size:11.5px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap;
}
#slashBar .hd{padding:4px 9px 2px; font-size:10.5px; color:var(--ink3); letter-spacing:.04em;}

/* 工具卡收折 */
.tool-card .th .fold{
  margin-left:6px; width:18px; height:18px; flex:none; border:0; background:none;
  color:var(--ink3); font-size:10px; line-height:1;
}
.tool-card .th .fold:hover{color:var(--accent);}
.tool-card.fold pre,.tool-card.fold .ta{display:none;}

#runBar{
  padding:4px 9px; margin-bottom:6px; border:1px solid var(--line); border-radius:8px;
  background:var(--ground); font-size:11px; color:var(--ink3); font-family:var(--mono);
  white-space:pre-line;              /* 第二行是「現在：<待辦>」 */
}
#resumeBar{
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
  padding:4px 6px 4px 9px; border:1px dashed var(--line2); border-radius:8px;
  background:var(--ground); font-size:11.5px; color:var(--ink2);
}
#resumeBar[hidden]{display:none;}
#resumeWhy{flex:1; min-width:0;}
#queueBar{
  display:flex; align-items:center; gap:8px; margin-bottom:6px;
  padding:4px 6px 4px 9px; border:1px solid var(--accent); border-radius:8px;
  background:var(--ground); font-size:11.5px; color:var(--ink2);
}
#queueBar[hidden]{display:none;}
#queueWhy{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

#ctxRow{display:flex; align-items:center; gap:8px; padding:1px 2px 5px;}
#ctxTrack{flex:1; height:4px; border-radius:2px; background:var(--hover); overflow:hidden;}
#ctxFill{height:100%; width:0; background:var(--accent); transition:width .25s;}
#ctxFill.warn{background:var(--warn);}
#ctxFill.over{background:var(--err);}
#ctxText{font-size:10.5px; color:var(--ink3); font-family:var(--mono); white-space:nowrap;}

/* ═══════════════ 工具呼叫 ═══════════════ */
.tool-card{
  border:1px solid var(--line2); background:var(--surface); border-radius:10px;
  padding:10px 12px; display:flex; flex-direction:column; gap:8px; max-width:min(760px,100%);
}
.tool-card .th{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;}
.tool-card .th .nm{font-family:var(--mono); color:var(--accent); font-weight:500;}
.tool-card pre{
  margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; font-family:var(--mono); font-size:11.5px; color:var(--code-ink);
  white-space:pre-wrap; word-break:break-word; max-height:230px; overflow:auto;
}
.tool-card .ta{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
/* 選項按鈕：.mini 預設 flex:none + 固定高度，長選項會一路頂出卡片外面。
   這裡讓它可以縮、可以換行、文字也可以折。 */
.tool-card .opts .mini{
  flex:0 1 auto; max-width:100%; height:auto; min-height:26px;
  padding:5px 10px; line-height:1.45; text-align:left;
  white-space:normal; overflow-wrap:anywhere;
}
/* 選起來的那一個要一眼看得出來。用跟思考模式分段、檔案樹同一組 token —— */
/* 「選中」在這個介面裡長什麼樣，只能有一種答案。 */
.tool-card .opts .mini.on{
  background:var(--think-sel); color:var(--think-sel-ink);
  border-color:var(--think-sel); font-weight:600;
}
.tool-card .opts .mini.on:hover{background:var(--think-sel);}
/* 送出鍵：選好了才亮起來。不能用 .primary —— .mini 在這份檔案裡排在它後面，
   同權重會把 height/border/background 全部蓋掉，class 加了等於沒加。 */
.tool-card .ta .mini[data-send]:not(:disabled){
  background:var(--accent); color:var(--accent-ink);
  border-color:var(--accent); font-weight:600;
}
.tool-card .st{font-size:11.5px; color:var(--ink3);}
.tool-card.done{border-color:var(--line);}

/* ═══════════════ 對話框：模型管理 / 比較 ═══════════════ */
.dialog.wide{max-width:820px;}
.dialog select, .dialog textarea{
  background:var(--ground); border:1px solid var(--line2); border-radius:9px;
  padding:7px 10px; font-size:12.5px; outline:none; width:100%; resize:vertical;
}
.dialog select:focus, .dialog textarea:focus{border-color:var(--accent);}
.row-list{display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow-y:auto; padding-right:2px;}

/* 還原點：照 VS Code 原始檔控制那一欄的排法 —— 一行一個檔案，
   狀態字母靠右，路徑用灰色接在檔名後面，不換行不加框。 */
.sc-list{display:flex; flex-direction:column; overflow-y:auto; flex:1; min-height:0;}
.sc-row{
  display:flex; align-items:center; gap:8px; padding:3px 10px 3px 12px;
  cursor:pointer; white-space:nowrap; font-size:12.5px; color:var(--ink2);
  border-left:2px solid transparent;
}
.sc-row:hover{background:var(--hover); border-left-color:var(--accent);}
.sc-row .nm{color:var(--ink); overflow:hidden; text-overflow:ellipsis; flex:none; max-width:52%;}
.sc-row .dir{color:var(--ink3); font-size:11px; overflow:hidden;
  text-overflow:ellipsis; flex:1; min-width:0;}
.sc-row .tm{color:var(--ink3); font-size:11px; font-family:var(--mono); flex:none;}
.sc-row .st{
  width:15px; text-align:center; font-weight:700; font-size:11px;
  font-family:var(--mono); flex:none;
}
.sc-row .st.m{color:var(--accent);}      /* Modified */
.sc-row .st.a{color:var(--ok, #3fb950);} /* Added */
.sc-head{
  display:flex; align-items:center; gap:6px; padding:8px 10px 4px 12px;
  font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--ink3);
  text-transform:uppercase;
}
.sc-head .cnt{
  background:var(--raised); border:1px solid var(--line2); border-radius:9px;
  padding:0 6px; font-size:10px; font-family:var(--mono); color:var(--ink2);
}
.sc-row.day{
  cursor:default; color:var(--ink3); font-size:11px; padding-top:8px;
  border-left-color:transparent; background:none;
}
.sc-row.day:hover{background:none; border-left-color:transparent;}
.mm-row{
  display:flex; align-items:center; gap:9px; padding:7px 10px; border:1px solid var(--line);
  border-radius:9px; background:var(--ground);
}
.mm-row .n{flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mm-row .m{font-size:11px; color:var(--ink3); font-family:var(--mono); white-space:nowrap;}
.mini{
  height:26px; padding:0 10px; border-radius:7px; border:1px solid var(--line2);
  background:var(--raised); font-size:11.5px; flex:none;
}
.mini:hover:not(:disabled){background:var(--hover);}
.mini:disabled{opacity:.45; cursor:not-allowed;}
.mini.danger:hover:not(:disabled){color:var(--err); border-color:var(--err);}
#pullTrack{height:5px; border-radius:3px; background:var(--hover); overflow:hidden; flex:1;}
#pullFill{height:100%; width:0; background:var(--accent); transition:width .2s;}
.stepper{display:flex; align-items:center; gap:0;}
.stepper button{
  width:32px; height:32px; border:1px solid var(--line2); background:var(--raised);
  color:var(--ink); font-size:16px; font-weight:600; line-height:1;
}
.stepper button:first-child{border-radius:8px 0 0 8px;}
.stepper button:last-child{border-radius:0 8px 8px 0;}
.stepper button:hover:not(:disabled){background:var(--hover); border-color:var(--accent);}
.stepper button:disabled{color:var(--ink3); cursor:not-allowed;}
.stepper .v{
  width:74px; height:32px; text-align:center;
  border:1px solid var(--line2); border-left:0; border-right:0;
  background:var(--ground); font-family:var(--mono); font-size:13px;
  font-variant-numeric:tabular-nums; outline:none; padding:0;
}
.stepper .v:focus{border-color:var(--accent);}
.fs-demo{
  margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--ground); font-size:calc(14px * var(--fs)); line-height:1.7; color:var(--ink);
}

.help-btn{
  width:15px; height:15px; margin-left:6px; border-radius:50%; flex:none;
  border:1px solid var(--line2); background:var(--raised); color:var(--ink3);
  font-size:10px; font-weight:700; line-height:1; padding:0; vertical-align:middle;
}
.help-btn:hover{border-color:var(--accent); color:var(--accent);}
.p-help{display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow-y:auto;}
.p-help .row{display:flex; flex-direction:column; gap:2px;}
.p-help .n{font-family:var(--mono); font-size:12px; color:var(--accent);}
.p-help .d{font-size:12px; color:var(--ink2); line-height:1.55;}
.p-help .lim{font-size:11px; color:var(--ink3); font-family:var(--mono);}

.sub-label{font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3);}

.cmp-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.cmp-col{
  border:1px solid var(--line); border-radius:10px; background:var(--ground);
  display:flex; flex-direction:column; min-height:200px; max-height:42vh; overflow:hidden;
}
.cmp-col .h{display:flex; align-items:center; gap:7px; padding:7px 9px; border-bottom:1px solid var(--line);}
.cmp-col .h select{height:28px; padding:0 6px; font-size:11.5px;}
.cmp-col .b{flex:1; overflow-y:auto; padding:10px 12px; font-size:12.5px; line-height:1.65;}
.cmp-col .f{padding:5px 9px; border-top:1px solid var(--line); font-size:10.5px; color:var(--ink3); font-family:var(--mono);}
@media (max-width:720px){ .cmp-grid{grid-template-columns:1fr;} }

#wsResult{
  font-size:11.5px; color:var(--ink3); font-family:var(--mono);
  overflow-wrap:anywhere; line-height:1.6;
}
#wsResult b{color:var(--ink2); font-weight:600;}

/* 右側面板的分頁 */
.tabs{display:flex; gap:2px; flex:1; min-width:0;}
.tab{
  height:26px; padding:0 11px; border-radius:7px; background:none; border:1px solid transparent;
  color:var(--ink3); font-size:12px; font-weight:600;
}
.tab:hover{color:var(--ink2); background:var(--hover);}
.tab.on{color:var(--ink); background:var(--raised); border-color:var(--line2);}

/* 檔案檢視：行號 + 內容 */
#fBody{flex:1; min-height:0; display:flex; flex-direction:column;}
.f-head{
  display:flex; align-items:center; gap:6px; padding:8px 10px 8px 14px;
  border-bottom:1px solid var(--line); font-size:11.5px;
}
.f-head .p{
  flex:1; min-width:0; font-family:var(--mono); color:var(--ink2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left;
}
.codeview{
  flex:1; min-height:0; overflow:auto; background:var(--code-bg);
  font-family:var(--mono); font-size:11.5px; line-height:1.65; padding:6px 0;
}
.cl{display:flex; white-space:pre;}
.cl:hover{background:var(--hover);}
.cl .ln{
  flex:none; width:48px; padding-right:10px; text-align:right; color:var(--ink3);
  user-select:none; position:sticky; left:0; background:var(--code-bg);
}
.cl .lt{padding-right:14px; color:var(--code-ink);}
.cl.add{background:color-mix(in srgb, var(--ok) 12%, transparent);}
.cl.add .lt{color:var(--ok);}
.cl.del{background:color-mix(in srgb, var(--err) 12%, transparent);}
.cl.del .lt{color:var(--err);}
.cl.hunk .lt{color:var(--ink3);}
.cl.hunk{background:var(--surface);}
.fv-empty{padding:18px 16px; color:var(--ink3); font-size:12px; line-height:1.7;}

/* 檔案樹：一列一個項目，縮排靠 padding-left，沒有連接線也看得懂層級 */
#treeWrap,#viewWrap{flex:1; min-height:0; display:flex; flex-direction:column;}
.tree{flex:1; min-height:0; overflow:auto; padding:4px 0 10px; font-size:12px;}
.tree .it{
  display:flex; align-items:center; gap:5px; padding:2px 10px 2px 0;
  color:var(--ink2); cursor:pointer; white-space:nowrap;
}
.tree .it:hover{background:var(--hover);}
.tree .it.on{background:var(--think-sel); color:var(--think-sel-ink);}
.tree .it .tw{
  width:12px; flex:none; text-align:center; color:var(--ink3); font-size:9px;
  transition:transform .12s;
}
.tree .it .tw.open{transform:rotate(90deg);}
.tree .it .nm{overflow:hidden; text-overflow:ellipsis;}
.tree .it.dir .nm{color:var(--ink); font-weight:500;}
.tree .it .sz{margin-left:auto; color:var(--ink3); font-size:10px; font-family:var(--mono);}
.tree .kids{display:none;}
.tree .kids.open{display:block;}
.ws-head .p{direction:ltr; font-weight:500; color:var(--ink);}
#brList .it{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:7px;
  cursor:pointer; font-size:12.5px;
}
#brList .it:hover{background:var(--hover);}
#brList .it .g{margin-left:auto; font-size:10.5px; color:var(--accent); font-family:var(--mono);}

/* 收合：箭頭貼在面板自己身上，收起來之後由畫面邊緣的細條叫回來 */
.chev-btn{
  width:22px; height:22px; flex:none; border:0; background:none; color:var(--ink3);
  font-size:15px; line-height:1; border-radius:6px; display:flex;
  align-items:center; justify-content:center;
}
.chev-btn:hover{background:var(--hover); color:var(--ink);}
.edge-rail{
  position:fixed; top:0; bottom:0; width:14px; border:0; padding:0; z-index:30;
  background:var(--surface); color:var(--ink3); font-size:13px; line-height:1;
  display:none; align-items:center; justify-content:center;
}
.edge-rail.left{left:0; border-right:1px solid var(--line);}
.edge-rail.right{right:0; border-left:1px solid var(--line);}
.edge-rail:hover{background:var(--hover); color:var(--accent);}
body.hide-sidebar #sidebar{display:none;}
body.hide-params #params{display:none;}
body.hide-sidebar #sideRail, body.hide-params #paramRail{display:flex;}
/* 窄畫面時面板本來就收著，浮層叫出來之後細條要讓開 */
@media (max-width:820px){ body:not(.show-sidebar) #sideRail{display:flex;} }
@media (max-width:1100px){ body:not(.show-params) #paramRail{display:flex;} }
body.show-sidebar #sideRail, body.show-params #paramRail{display:none;}

/* 工具卡裡的 diff */
.diff{white-space:pre-wrap; font-family:var(--mono); font-size:11.5px; line-height:1.5;}
.diff .a{color:var(--ok);}
.diff .d{color:var(--err);}
.diff .h{color:var(--ink3);}

/* 壓縮後的摘要訊息 */
.msg.user.compacted .bubble{
  background:var(--raised); color:var(--ink2); border:1px dashed var(--line2); font-style:italic;
}

/* 附件晶片 */
.file-chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--raised);
  border:1px solid var(--line2); border-radius:6px; padding:2px 4px 2px 8px;
  margin:0 5px 4px 0; color:var(--ink2);
}
.file-chip.editable{cursor:pointer;}
.file-chip.editable:hover{border-color:var(--accent); color:var(--ink);}
.file-chip .x{
  border:0; background:none; color:var(--ink3); padding:0 3px; border-radius:4px; line-height:1;
}
.file-chip .x:hover{color:var(--err); background:var(--hover);}
.danger-text{color:var(--err);}

/* 窄畫面：收掉兩側欄，但要能從 ⋯ 選單叫回來（否則參數與對話清單就消失了） */
@media (max-width:1100px){
  #params{display:none;}
  body.show-params #params{display:flex; position:absolute; right:0; top:0; bottom:0; z-index:40;
    box-shadow:-12px 0 32px rgba(0,0,0,.35);}
}
@media (max-width:820px){
  #sidebar{display:none;}
  body.show-sidebar #sidebar{display:flex; position:absolute; left:0; top:0; bottom:0; z-index:40;
    box-shadow:12px 0 32px rgba(0,0,0,.35);}
}


/* ═══════════════ 側欄拖寬 ═══════════════ */
/* 把手放在側欄**裡面**的內側邊緣：兩側欄都是 overflow:hidden，
   用負的 right/left 把手會被切掉。6px 是 VSCode 那類編輯器的量級。 */
.resizer{
  position:absolute; top:0; bottom:0; width:6px; z-index:6;
  cursor:col-resize; background:transparent; border:0; padding:0;
  touch-action:none;                 /* 不然行動裝置上會變成捲動 */
}
#sidebar .resizer{right:0;}
#params  .resizer{left:0;}
.resizer:hover, .resizer.dragging{background:var(--accent); opacity:.55;}
/* 拖的時候整頁鎖住游標與選取，不然滑過文字會反白一片 */
body.resizing, body.resizing *{cursor:col-resize !important; user-select:none !important;}

/* ═══════════════ 模型寫出來的 檔案:行號 ═══════════════ */
/* 用虛線底線而不是藍字：它出現在一段技術文字中間，做得跟外部連結一樣顯眼會很吵。 */
.file-ref{
  cursor:pointer; border-bottom:1px dashed var(--ink3);
  text-underline-offset:2px;
}
.file-ref:hover{color:var(--accent); border-bottom-color:var(--accent);}
/* 跳過去的那一行要亮一下，不然使用者還是得自己數行號 */
#fvBody .cl.hit{background:var(--think-sel); border-radius:4px;}
#fvBody .cl.hit .ln{color:var(--think-sel-ink);}

/* 被擋住的待辦：淡一點，但不能像做完的那樣劃掉 —— 它還沒做 */
#todoBar .t.blocked{opacity:.62;}
#todoBar .t .dep{color:var(--ink3); font-size:10.5px;}

/* 一輪的總計：跟 per-message 的統計並排，但用等寬字，方便比對不同輪的數字 */
.msg-foot .turn{
  font-size:11px; color:var(--ink3); font-family:var(--mono);
  border-left:1px solid var(--line2); padding-left:10px;
}

/* ── topbar 的系統用量 ─────────────────────────────────────────────
   模型跑起來的時候，唯一會先撞到的是 VRAM —— 12G 的卡塞 14B 的模型
   會靜靜地把層數搬回 CPU，速度掉一個數量級而且不報錯。所以 VRAM 排第一，
   窄畫面留下來的也是它。 */
#sysBar{
  display:flex; gap:8px; align-items:center; background:none; border:0;
  padding:3px 8px; border-radius:8px; color:var(--ink2);
  font-size:11.5px; font-family:var(--mono); white-space:nowrap;
}
#sysBar:hover{background:var(--ground);}
#sysBar .m{display:flex; gap:4px; align-items:center;}
#sysBar .m b{font-weight:600; color:var(--ink);}
#sysBar .m.hot b{color:var(--warn);}
#sysBar .m.full b{color:var(--err);}
@media (max-width:1180px){#sysBar .m:not(:first-child){display:none;}}
@media (max-width:760px){#sysBar{display:none;}}
.sys-full{display:grid; gap:10px; margin-bottom:14px;}
.sys-full .row{display:flex; justify-content:space-between; gap:12px; font-size:12.5px;}
.sys-full .row .k{color:var(--ink2);}
.sys-full .row .v{font-family:var(--mono);}
.sys-full .bar{height:5px; border-radius:999px; background:var(--ground); overflow:hidden;}
.sys-full .bar i{display:block; height:100%; background:var(--accent);}
.sys-full .bar.hot i{background:var(--warn);}
.sys-full .bar.full i{background:var(--err);}
.sys-pick{display:flex; flex-wrap:wrap; gap:14px; margin:8px 0 4px;}
</style>

// 一輪跑完之後留在對話裡的那一行。**per-message 的統計看不出這個** ——
// 那裡寫的是「這一次呼叫模型花了幾秒」，一輪十幾次呼叫加上工具執行時間，
// 加起來是完全不同的數字。長任務要看的是這個。
function turnLine(t) {
  if (!t) return '';
  return '這一輪 ' + fmtElapsed(t.ms) + ' · ' + t.rounds + ' 輪 · '
    + t.calls + ' 次工具 · ' + fmtTokens(t.tokens) + ' tokens';
}

const CONN_HINT = '尚未連線，無法送出';
const RETRY_MAX = 4;
const RETRY_BASE_MS = 2000;

// **只重試「這一次根本沒接上」的錯誤。** 已經開始吐字之後再重試會重複一段，
// 而 4xx 重試幾次都一樣（模型名打錯、參數不合法）。
function isRetryable(err, gotAnything) {
  if (gotAnything) return false;
  if (err && err.name === 'AbortError') return false;
  const raw = String((err && err.message) || err || '');
  if (/failed to fetch|networkerror|load failed|connection|ECONNREFUSED/i.test(raw)) return true;
  const m = raw.match(/HTTP (\d{3})/);
  return !!m && ['500', '502', '503', '504', '429'].indexOf(m[1]) >= 0;
}

const AT_DIR_FILES = 40;
const AT_DIR_CHARS = 120000;

// 從扁平的檔案清單推出有哪些資料夾。清單本來就在手上，不必再問一次伺服器。
function dirsOf(files) {
  const seen = {};
  (files || []).forEach(function (p) {
    const parts = p.split('/');
    for (let i = 1; i < parts.length; i++) seen[parts.slice(0, i).join('/') + '/'] = 1;
  });
  return Object.keys(seen).sort();
}

function filesUnder(files, dir) {
  return (files || []).filter(function (p) { return p.indexOf(dir) === 0; });
}

// 「跑了多久」的人話。長任務時這是唯一看得出「它還在動」的東西之一。
function fmtElapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  return m < 60 ? m + ' 分 ' + (s % 60) + ' 秒'
                : Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分';
}

// topbar 的系統用量。順序＝顯示順序＝窄畫面時誰活下來，
// VRAM 排第一是因為它是唯一一個「爆了不會報錯、只會慢十倍」的東西：
// 塞不下的層會被 Ollama 搬回 CPU，畫面上什麼都看不出來。
const SYS_METRICS = [
  ['vram', 'VRAM', '顯示卡記憶體。模型塞不下就會被搬回 CPU 跑'],
  ['ram', 'RAM', '系統記憶體'],
  ['cpu', 'CPU', '這台機器的 CPU 忙碌程度'],
  ['gpu', 'GPU', '顯示卡的運算使用率']
];

// 一格用量要顯示的字，外加 0～1 的滿載程度（畫顏色與長條用）。
// 拿不到資料就回 null —— 那一格整個不畫，而不是畫一個「—」讓人以為是 0。
function sysCell(id, d) {
  if (!d) return null;
  const card = (d.gpu || [])[0];
  if (id === 'vram') {
    if (!card || !card.vram || !card.vram.total) return null;
    return { text: card.vram.used.toFixed(1) + '/' + card.vram.total.toFixed(0) + ' G',
             at: card.vram.used / card.vram.total };
  }
  if (id === 'ram') {
    if (!d.ram || !d.ram.total) return null;
    return { text: d.ram.used.toFixed(1) + '/' + d.ram.total.toFixed(0) + ' G',
             at: d.ram.used / d.ram.total };
  }
  if (id === 'cpu') {
    if (typeof d.cpu !== 'number' || d.cpu < 0) return null;
    return { text: d.cpu.toFixed(0) + '%', at: d.cpu / 100 };
  }
  if (id === 'gpu') {
    if (!card || typeof card.util !== 'number') return null;
    return { text: card.util + '%', at: card.util / 100 };
  }
  return null;
}

// 顏色只有三段：夠用、快滿了、滿了。再細分沒有人看得出差別。
function sysLevel(at) { return at >= 0.92 ? 'full' : (at >= 0.75 ? 'hot' : ''); }

// 等第一個字時，訊息裡要畫的那一行。回空字串＝不用畫
// （思考內容自己在動，看得到就不必再講一次）。
function waitText(ms, thinking, showThink) {
  if (!thinking) return '等模型回應… ' + fmtElapsed(ms);
  if (showThink) return '';
  return '思考中… ' + fmtElapsed(ms) + '（已寫 ' + thinking.length +
    ' 字，「顯示思考」關著所以看不到內容）';
}

// 現在正在做的那一項：第一個還沒完成的待辦。
// 對照 Claude Code 的 spinner，它會顯示 `Next: <下一項待辦>` —— 輪數與 token 數
// 說明「跑了多少」，這一句說明「在幹嘛」，兩者缺一不可。
function currentTodo(todos) {
  const t = (todos || []).filter(function (x) { return !x.done; })[0];
  return t ? t.text : '';
}

// 「模型說做完了」的那一刻要攔一次的依據。
// 對照 Claude Code 的 Stop hook：它的回傳可以帶 additionalContext，
// schema 原文寫「the conversation continues so the model can act on it」——
// 也就是模型要停下來時還能被推回去繼續。這裡不做成可設定的 hook（那個拿掉了），
// 條件寫死成一條：**寫了測試卻一次都沒跑過**。
//
// 刻意不做「改了程式就要跑測試」：那條在沒有測試的專案上永遠是誤報，
// 而誤報的自動提醒最後一定會被關掉。寫了測試沒跑，沒有第二種解釋。
// 這兩條不折行，而且不能以 \/ 收尾：tests/test_gui.js 的 grab() 只吃得下一行
// 寫完的 const，而且會把 // 之後當成行尾註解砍掉 —— 原本結尾是 tests?\//i，
// 那個 \// 會被當成註解起點，抓回去的正規表示式就少了收尾的斜線。
const TEST_FILE_RE = /(^|\/)tests?\/|(^|\/)(test_[^/]+\.py|[^/]+_test\.(py|go|rb)|[^/]+\.(test|spec)\.[jt]sx?)$/i;
const TEST_CMD_RE = /\b(pytest|unittest|jest|vitest|mocha|ava|go test|cargo test|npm (run )?test|yarn test|pnpm test)\b/i;

function looksLikeTestFile(path) { return TEST_FILE_RE.test(String(path || '')); }
function looksLikeTestRun(name, args) {
  if (name === 'run_tests') return true;
  return name === 'run_shell' && TEST_CMD_RE.test(String((args || {}).command || ''));
}

// 迴圈要結束了 —— 回傳一句要塞回去的話，或空字串代表可以收工。
// ponytail: 只有一條規則（寫了測試沒跑），一輪只攔一次。
//          「改了程式就要跑測試」在沒有測試的專案上永遠是誤報，所以不做。
//           要更多條件的話這裡改成一串 check 依序跑，但先想清楚誤報的代價。
function finishCheck(run) {
  if (!run || run.nagged) return '';                 // 一輪只攔一次，不然模型堅持不跑會卡死
  if (!run.wroteTests || run.ranTests) return '';
  return '你在這一輪寫了測試（' + run.wroteTests + '）卻一次都沒有跑過。'
    + '用 run_tests 跑一次；沒過就修到過，然後再說做完了。';
}

function toolDefs() {
  const all = S.toolDefs || [];
  // ponytail: 子代理（task）走的是 Ollama 的 /api/chat，外部 API 模式下沒有
  //           對應的路徑，所以那邊乾脆不給這一支 —— 給了只會在呼叫時才爆。
  //           要支援就把 runSubagent 改成走 chatStream。
  return S.provider === 'openai'
    ? all.filter(function (d) { return ((d.function || {}).name) !== 'task'; })
    : all;
}

// 後端的 tail_of() 的前端版。**中途停掉那條路繞過了後端的截斷** ——
// 正常結束時結果是後端算好的（留最後 100 行），按停止或連線斷掉時用的是
// 瀏覽器自己累積的整段，而那一段最多會到 MAX_RUN_BYTES（2MB）。
// 沒有這一支的話「按停止」比「讓它跑完」更容易把 context 撐爆。
const TAIL_KEEP = 100;

function tailLines(text, keep) {
  const lines = String(text || '').split('\n');
  keep = keep || TAIL_KEEP;
  if (lines.length <= keep) return String(text || '');
  const bad = lines.slice(0, -keep)
    .filter(function (ln) { return /(FAILED|ERROR|Traceback|assert |Exception)/.test(ln); })
    .slice(-40);
  const head = '（前面省略 ' + (lines.length - keep) + ' 行'
    + (bad.length ? '，以下是其中的錯誤行）\n' + bad.join('\n') + '\n…\n' : '）\n');
  return head + lines.slice(-keep).join('\n');
}

// **失控煞車，不是預算。** 這個數字唯一擋的是模型繞圈（A→B→A→B ——
// REPEAT_LIMIT 只認得參數一模一樣的重試，繞圈認不出來）。
// 原本是 25，而 25 輪對「改一個檔 → 跑測試 → 再改」的任務常常不夠，
// 停下來等人按「繼續」就違反了放著跑的目的。
const MAX_TOOL_ROUNDS = 200;
const ROUNDS_WARN = 5;          // 剩這麼多輪才提醒。太早講只是每輪多燒一句話

// 撞到上限之前先讓模型知道。不講的話它不會安排優先順序 ——
// 可能把 20 輪花在到處讀檔，剩 5 輪才開始動手，然後停在一半。
function roundsNote(depth) {
  const left = MAX_TOOL_ROUNDS - depth;
  if (left > ROUNDS_WARN) return '';
  if (left <= 0) {
    return '（工具輪數用完了，這是最後一次回答。把已經做好的存檔，'
      + '然後講清楚做到哪裡、還剩什麼沒做。）';
  }
  return '（工具還剩 ' + left + ' 輪就會停下來。'
    + (left <= 2 ? '開始收尾：先存檔，再講清楚進度。' : '先做最重要的那幾件事。') + '）';
}

// **本機模型不設預算。** 原本有一個 30 分鐘的時鐘上限，撞到就停下來等人按
// 「繼續」—— 但那正好違反「放著讓它自己跑完」這個目的，而本機跑掉的
// 只有電費與時間，沒有別人在替你結帳。
//
// 外部 API 是另一回事：那裡的 token 是錢，而且是自動模式下沒人看著燒的。
// 所以護欄留在有代價的那一邊，用 token 不用時鐘（時鐘跟花費沒有關係，
// 等對方 API 排隊也是時間）。撞到不是結束，是停下來給一顆「繼續」。
const OA_TOKEN_BUDGET = 150000;

function budgetStop(run) {
  if (!run || S.provider !== 'openai') return '';
  if (run.tokens > OA_TOKEN_BUDGET) {
    return '這一輪已經用掉 ' + fmtTokens(run.tokens)
      + ' tokens（外部 API 是按量計費的），先停下來讓你看一眼';
  }
  return '';
}

// 自動模式：哪些工具不必每次問。危險指令永遠會問，不受這裡影響。
const AUTO_MODES = [
  ['off', '每一次都問', '每個工具呼叫都要你按執行'],
  ['read', '唯讀自動', '讀檔、搜尋、列目錄自動放行；改檔案、跑指令仍要你點頭'],
  ['edit', '改檔案自動', '連改檔案也自動放行；run_shell、run_tests 仍要你點頭'],
  ['full', '跑指令自動', 'run_shell／run_tests／setup_env 也自動放行；'
    + 'rm、sudo、pip install 這種風險指令仍要你點頭'],
  ['ws', '工作區內全自動', '連 rm、mv、chmod 也自動放行 —— 但只限路徑全都在工作區裡的；'
    + '動到工作區外、sudo、裝套件仍要你點頭。沙盒開著時全部不問（沙盒本身就出不去）']
];
const READ_ONLY_TOOLS = ['read_file', 'list_dir', 'search_files', 'fetch_url',
  'todo_write', 'load_skill'];   // load_skill 只是讀 serve.py 旁邊的一份說明

function autoLabel() {
  const m = AUTO_MODES.filter(function (x) { return x[0] === S.auto; })[0] || AUTO_MODES[0];
  return m[1];
}

// 回傳 true 代表這一次不用問人。
// 順序（第一個成立的說了算）：
//   deny 規則 > 風險指令一律問 > allow 規則 > 自動模式
// allow **不能**蓋過風險指令 —— 那條保證是寫在文件上的，
// 不能被一個設定檔悄悄拿掉。deny 由伺服器真的擋，這裡只是不要白問一次。
function autoApprove(name, risk, rule, scope) {
  if (rule && rule.action === 'deny') return false;
  if (risk === 'block') return false;             // 這一級 serve.py 直接拒絕，本來就跑不了
  // 危險指令要人看過。唯一的例外是「工作區內全自動」加上後端算出這行指令
  // 動到的路徑全都在工作區裡（scope === 'ws'，ws_scoped() 判的；沙盒開著時
  // 每一行指令都算，因為沙盒外面是唯讀的）——
  // 那一類改壞了還有 git 與 .zackllmgui-backup/ 救得回來，而且它是
  // 「放著跑測試」最常撞到的一格（rm 掉 __pycache__、mv 檔案）。
  if (risk && risk !== 'ok' && !(S.auto === 'ws' && scope === 'ws')) return false;
  if (rule && rule.action === 'allow') return true;
  if (rule && rule.action === 'ask') return false;
  if (S.auto === 'read') return READ_ONLY_TOOLS.indexOf(name) >= 0;
  // 改檔案自動、跑指令要問。這一格是平常該待的地方：改檔案佔了工具呼叫
  // 一半以上，而且**改檔案有還原點**（journal + backup），點錯了倒得回來；
  // run_shell 沒有。少了這一格，人的實際反應是「改十個檔要點十次，乾脆整個放開」
  // —— 那才是真正的風險。setup_env 不算：它要連網裝套件，那是指令不是改檔案。
  if (S.auto === 'edit') {
    return READ_ONLY_TOOLS.indexOf(name) >= 0 || WRITE_TOOLS.indexOf(name) >= 0;
  }
  // 計畫還是要人核准
  if (S.auto === 'full' || S.auto === 'ws') return name !== 'submit_plan';
  return false;
}

const FIELDS = ['num_ctx', 'num_predict', 'seed', 'keep_alive', 'stop',
  'num_keep', 'num_batch', 'num_gpu', 'num_thread', 'draft_num_predict'];

// [欄位, 一句話說明, 上限的算法]
// max 是函式的原因：num_gpu 看模型有幾層、num_thread 看這台機器有幾顆核心，
// 兩個都要等載入之後才知道，寫死在 HTML 裡會是錯的。
const PARAM_HELP = [
  ['num_ctx', 'context 視窗長度，單位是 K（1K = 1024 tokens，填 64 就是 65536）。' +
    '整段對話加上模型的回覆都要塞得進去，' +
    '超過就會從最前面開始被丟掉。開大不是免費的：KV cache 會跟著線性長，' +
    '記憶體不夠時 Ollama 會把層數搬回 CPU，速度直接掉一個數量級。',
   function () {
     // 上限是模型自己的 context_length（伺服器的 /api/show）。填得比它大的話
     // Ollama 不會報錯，它就是默默用模型的上限 —— 那是最難查的一種「變笨」。
     const max = S.ctxMax[S.model] || 0;
     return max
       ? { max: Math.floor(max / 1024), unit: 'K',
           note: (S.model || '這個模型') + ' 支援到 ' + Math.floor(max / 1024) + 'K' }
       // 問不到就不要顯示上限。掰一個數字出來比沒有更糟 ——
       // 使用者會以為那是真的，然後照著它調。
       : { max: 0, unit: 'K', note: '問不到這個模型的 context 上限，這裡不設限制' };
   }, 'num_ctx（K）'],
  ['num_predict', '這一次最多產生幾個 token。-1 是不限、-2 是填滿 context。' +
    '思考模式的內容也算在裡面 —— 想限制模型想太久就用這個。', null],
  ['seed', '亂數種子。填同一個數字加上同樣的參數與提示，輸出就可以重現。' +
    '-1 或空白是每次都隨機。', null],
  ['keep_alive', '產生完之後模型在記憶體裡待多久。5m、1h 這種寫法，' +
    '0 是用完立刻卸載，-1 是一直留著。留著下一次不用重載，代價是佔著顯示記憶體。', null],
  ['stop', '遇到這些字串就停下來，多組用逗號分隔。' +
    '模型不會把停止字串本身輸出出來。', null],
  ['num_keep', '重新計算 context 時，開頭要保留幾個 token 不被丟掉。' +
    '通常留給系統提示，讓它在長對話裡不會被擠掉。', null],
  ['num_batch', '一次餵給模型幾個 token 做 prompt 評估。調大讀提示比較快、' +
    '但瞬間佔用的記憶體也比較多。記憶體吃緊時往下調（256、128）。', null],
  ['num_gpu', '要把幾層搬到 GPU 上跑。0 是全部用 CPU，' +
    '設成模型的層數就是整個放進 GPU。放不下時 Ollama 會自己減，' +
    '手動指定通常是為了留顯示記憶體給別的東西。',
   function () {
     // 上限是模型自己的層數，從伺服器的 /api/show（model_info 的 *.block_count）讀來，
     // 跟誰開這個網頁無關 —— 這個數字本來就是「跑模型那一端」的事實。
     return S.layers[S.model]
       ? { max: S.layers[S.model],
           note: S.model + ' 有 ' + S.layers[S.model] + ' 層（來自伺服器的 /api/show）' }
       : { max: 0, note: '要先選好模型才知道層數' };
   }],
  ['num_thread', 'CPU 推論要用幾條執行緒。預設是實體核心數，' +
    '設超過核心數不會更快（互相搶反而更慢）。' +
    '要留 CPU 給別的工作時才往下調。注意它是套用在**跑 Ollama 的那一台**，' +
    '不是開這個網頁的這台 —— 兩者不同機器時這裡讀不到上限。',
   function () {
     // 這個數字只有「serve.py 跟 Ollama 同一台」時才拿得到（serve.py 回報 os.cpu_count()）。
     // Ollama 的 API 沒有任何一支回報主機的核心數，所以遠端時就是不設上限，
     // 不要拿開網頁這台的核心數去冒充。
     if (!ollamaIsLocal()) {
       return { max: 0,
                note: 'Ollama 在 ' + (S.upstream || '遠端') +
                      '，它的 API 不回報主機核心數，所以這裡不設上限' };
     }
     return S.cpus ? { max: S.cpus, note: '伺服器 ' + S.cpus + ' 顆邏輯核心（os.cpu_count）' }
                   : { max: 0, note: '（讀不到核心數）' };
   }],
  ['draft_num_predict', '推測解碼（speculative decoding）一次讓草稿模型先猜幾個 token。' +
    '猜中就一次收下、省掉好幾輪；猜錯就白算。只有搭配草稿模型（例如 MTP 頭）才有意義。',
   null]
];

// key 沿用舊名：改掉的話大家存在瀏覽器裡的對話會全部讀不到
const LS_CONF = 'ollama_gui.config';
const LS_CHATS = 'ollama_gui.chats';
const LS_PRESETS = 'ollama_gui.presets';

/* ══════════════════════ 狀態 ══════════════════════ */
const S = {
  host: DEFAULT_HOST, models: [], caps: {}, model: '', conn: 'idle',
  version: '?', chats: [], currentId: null, params: Object.assign({}, DEFAULTS),
  think: false, showThink: true, theme: 'dark', images: [], fontScale: 1, userName: '',
  ctxMax: {}, atFiles: null,

/* ══════════════════════ 小工具 ══════════════════════ */
const $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function uid() { return Math.random().toString(36).slice(2, 12); }
function normalizeHost(h) {
  h = (h || '').trim().replace(/\/+$/, '');
  if (!h) return DEFAULT_HOST;
  if (!/^https?:\/\//i.test(h)) h = 'http://' + h;
  return h;
}
function humanSize(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + u[i];
}
// localStorage 在 file:// 下不是每個瀏覽器都給用，全部包起來，壞掉就只存在記憶體
function lsGet(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
// 回傳有沒有真的存進去。**這個回傳值不能省** —— 這個 catch 除了無痕模式，
// 也吞掉 QuotaExceededError，而配額滿了之後每一次 saveChats() 都會無聲失敗，
// 重整才發現整場任務沒了。靜靜掉資料是最不該簡化掉的那一類。
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

/* ══════════════════════ 對話存哪裡 ══════════════════════
   結論：**IndexedDB，一則對話一筆紀錄**，完全不出這台瀏覽器。

   為什麼不是 localStorage（原本的做法）：配額只有 5–10MB，而一場長的 agent 任務
   光工具輸出就 400KB 上下 —— 十幾場就滿。滿了之後 setItem 丟 QuotaExceededError，
   整份對話存不進去。而且它是同步的：每次存都要把「全部」對話 JSON.stringify 一遍，
   串流中一秒好幾次，那是主執行緒上實打實的停頓。

   為什麼不是寫進 serve.py 那一端：對話裡有專案路徑與程式碼，一旦落地就得回答
   「同一台 serve.py 上誰讀得到誰的對話」。伺服器只出算力，資料留在瀏覽器，
   這句話才講得清楚。

   IndexedDB 給的是：配額按磁碟算（GB 級）、非同步、structured clone 不必先轉字串、
   而且**一則對話一筆**，所以存的時候只寫改動的那一則，兩個分頁也不會整包蓋掉對方。 */
const DB_NAME = 'zackllmgui';
const DB_STORE = 'chats';
let dbPromise = null;

function chatDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise(function (ok, bad) {
    let req;
    // file:// 下 Firefox 直接不給用，無痕模式也可能擋 —— 這裡失敗就回頭走 localStorage
    try { req = indexedDB.open(DB_NAME, 1); } catch (e) { bad(e); return; }
    req.onupgradeneeded = function () {
      req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    };
    req.onsuccess = function () { ok(req.result); };
    req.onerror = function () { bad(req.error || new Error('IndexedDB 開不起來')); };
    req.onblocked = function () { bad(new Error('IndexedDB 被其他分頁擋住')); };
  });
  return dbPromise;
}

function dbRun(mode, fn) {
  return chatDb().then(function (d) {
    return new Promise(function (ok, bad) {
      const tx = d.transaction(DB_STORE, mode);
      const req = fn(tx.objectStore(DB_STORE));
      // 等 tx 完成而不是等 req.success：readwrite 要交易真的落地才算存到
      tx.oncomplete = function () { ok(req ? req.result : undefined); };
      tx.onerror = function () { bad(tx.error); };
      tx.onabort = function () { bad(tx.error || new Error('交易被中止')); };
    });
  });
}

// 新的排在前面。用 created 而不是陣列順序：兩個分頁各自寫自己的那幾則時，
// 「第幾個」會打架，「什麼時候建的」不會。
function chatsLoad() {
  return dbRun('readonly', function (st) { return st.getAll(); }).then(function (list) {
    return (list || []).sort(function (a, b) { return (b.created || 0) - (a.created || 0); });
  });
}
function chatPut(c) { return dbRun('readwrite', function (st) { return st.put(c); }); }
function chatDrop(id) { return dbRun('readwrite', function (st) { return st.delete(id); }); }
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

/* ══════════════════════ Markdown ══════════════════════ */
const KEYWORDS = new Set(('def class return import from as if elif else for while with try except ' +
  'finally raise lambda yield pass break continue in not and or is None True False async await ' +
  'global nonlocal assert del function const let var new this typeof export default public private ' +
  'static void int float char bool struct func package type interface fn mut impl use select insert ' +
  'update delete where join group order echo exit then fi do done esac').split(' '));

const HL_LANGS = new Set(['', 'python', 'py', 'javascript', 'js', 'typescript', 'ts', 'json',
  'bash', 'sh', 'shell', 'powershell', 'ps1', 'sql', 'c', 'cpp', 'java', 'go', 'rust', 'rs',
  'yaml', 'toml']);

function highlight(code, lang) {
  if (!HL_LANGS.has((lang || '').toLowerCase())) return esc(code);
  const re = /("[^"\n]*"|'[^'\n]*')|(#[^\n]*|\/\/[^\n]*)|(\b\d+\.?\d*\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="s">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="c">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="n">' + esc(t) + '</span>';
    else if (KEYWORDS.has(t)) out += '<span class="k">' + esc(t) + '</span>';
    else if (code[m.index + t.length] === '(') out += '<span class="f">' + esc(t) + '</span>';
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}

function inlineMd(text) {
  let out = esc(text);
  out = out.replace(/`([^`\n]+)`/g, function (_, c) { return '<code>' + c + '</code>'; });
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  out = out.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  return out;
}

function blockMd(text) {
  const lines = text.split('\n');
  let html = '', para = [], list = null;
  function flushPara() {
    if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; }
  }
  function flushList() {
    if (list) { html += '<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>'; list = null; }
  }
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i], t = raw.trim();
    const h = /^(#{1,6})\s+(.*)$/.exec(t);
    const ul = /^[-*+]\s+(.*)$/.exec(t);
    const ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if (h) { flushPara(); flushList(); html += '<h3>' + inlineMd(h[2]) + '</h3>'; }
    else if (ul) {
      flushPara();
      if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
      list.items.push('<li>' + inlineMd(ul[1]) + '</li>');
    } else if (ol) {
      flushPara();
      if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
      list.items.push('<li>' + inlineMd(ol[1]) + '</li>');
    } else if (!t) { flushPara(); flushList(); }
    else { flushList(); para.push(inlineMd(raw)); }
  }
  flushPara(); flushList();
  return html;
}

// 把模型寫出來的 `wafer_counter.py:42` 變成點得下去的東西。
//
// **在 DOM 上做，不在 HTML 字串上做**：訊息是字串組出來的，字串取代會誤傷
// href="…" 與 data-code="…" 這類屬性。只走文字節點就完全沒有這個問題。
//
// **只認工作區裡真的存在的檔案**。不驗的話 http://host:8080 與 example.com:443
// 都會被當成「檔案:行號」—— 副檔名白名單擋不住 .com:443。
const FILE_REF_RE = /([A-Za-z0-9_][A-Za-z0-9_./-]*\.[A-Za-z0-9]{1,8})(?::(\d+))?/g;

function fileRefTarget(path) {
  const files = S.atFiles || [];
  if (!files.length) return '';
  if (files.indexOf(path) >= 0) return path;
  // 模型常常只寫檔名不寫路徑。只有唯一一個同名檔時才敢連過去。
  const hits = files.filter(function (f) {
    return f === path || f.endsWith('/' + path);
  });
  return hits.length === 1 ? hits[0] : '';
}

function linkifyFileRefs(root) {
  if (!root || !(S.atFiles || []).length) return;
  const skip = { A: 1, BUTTON: 1, TEXTAREA: 1, INPUT: 1 };
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walk.nextNode()) {
    const n = walk.currentNode;
    if (!n.parentElement || skip[n.parentElement.tagName]) continue;
    if (n.parentElement.closest('a')) continue;
    if (FILE_REF_RE.test(n.nodeValue)) nodes.push(n);
    FILE_REF_RE.lastIndex = 0;
  }
  nodes.forEach(function (node) {
    const frag = document.createDocumentFragment();
    let last = 0, m;
    FILE_REF_RE.lastIndex = 0;
    while ((m = FILE_REF_RE.exec(node.nodeValue)) !== null) {
      const target = fileRefTarget(m[1]);
      if (!target) continue;
      if (m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
      const a = document.createElement('span');
      a.className = 'file-ref';
      a.textContent = m[0];
      a.setAttribute('data-path', target);
      if (m[2]) a.setAttribute('data-line', m[2]);
      a.title = '在檔案分頁開啟 ' + target + (m[2] ? ' 第 ' + m[2] + ' 行' : '');
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (!frag.childNodes.length) return;
    if (last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function renderMarkdown(src) {
  const re = /```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += blockMd(src.slice(last, m.index));
    const lang = (m[1] || '').trim();
    const code = m[2].replace(/\n$/, '');
    out += '<div class="code"><div class="code-head"><span class="code-lang">' +
      esc(lang || 'text') + '</span>' +
      '<button class="code-copy" title="複製程式碼" data-code="' + esc(code) + '">' +
      ico('copy', 13) + '</button></div><pre>' + highlight(code, lang) + '</pre></div>';
    last = m.index + m[0].length;
  }
  return out + blockMd(src.slice(last));
}

/* ══════════════════════ Ollama API ══════════════════════ */
// serve.py 自己的端點，跟 Ollama 的 /api/* 不是同一回事。
// S.host 是「Ollama 在哪」—— 照 README 的建議把它指到 GPU 主機之後，
// /tool、/ls、/workspace 這些還是要問**端出這個頁面的那一台**，
// 不然檔案分頁會說「這個頁面不是本機開的」，而且工具全部打到 Ollama 去。
const SRV_PATHS = /^\/(upstream|tool|tools|run|preview|workspace|view|ls|browse|journal|rewind|rules|skills|git|restore|extract|ext|mcp|sys)$/;

function apiUrl(path) {
  if (SAME_ORIGIN && SRV_PATHS.test(path)) return location.origin + path;
  return S.host.replace(/\/+$/, '') + path;
}

/* ── 分頁身分 ───────────────────────────────────────────────────────
   serve.py 的工作區、能不能改檔案、待辦、計畫都是**跟著分頁走**的。分頁靠這個
   id 認回自己那一份；漏送的請求會落到「預設分頁」，而那正是原本兩個分頁互相
   蓋掉工作區的行為 —— A 分頁的 write_file 靜靜寫進 B 的資料夾。
   所以不在二十幾個 fetch 各補一次 header，而是包一層：新加的呼叫也不會漏。

   每次載入都重新產生，不存 sessionStorage：瀏覽器的「複製分頁」會把
   sessionStorage 一起複製，兩個分頁就會拿到同一個 id，等於沒修。
   重新整理換一個 id 沒關係 —— 網頁本來就會在載入時把自己的工作區推回去。 */
const TAB_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);

// 只有**同源、而且是 serve.py 自己的端點**才掛 X-Tab。跨來源加自訂 header 會逼出
// OPTIONS 預檢，Ollama 不見得接得住 —— 加錯地方的代價是整個頁面連不上。
function isSrvUrl(url) {
  if (!SAME_ORIGIN || String(url).indexOf(location.origin) !== 0) return false;
  return SRV_PATHS.test(String(url).slice(location.origin.length).replace(/[?#].*$/, ''));
}

if (typeof window !== 'undefined' && window.fetch) {
  const rawFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : ((input && input.url) || '');
    if (!isSrvUrl(url)) return rawFetch(input, init);
    const next = Object.assign({}, init);
    next.headers = new Headers((init && init.headers)
      || (typeof input !== 'string' && input ? input.headers : undefined));
    next.headers.set('X-Tab', TAB_ID);
    return rawFetch(input, next);
  };
}

function friendlyError(err) {
  if (err && err.name === 'AbortError') return { msg: '（已停止）', abort: true };
  const raw = (err && err.message) || String(err);
  // fetch 失敗只會給 "Failed to fetch"，八成是 CORS 或主機不在
  if (/failed to fetch|networkerror|load failed/i.test(raw)) {
    if (S.provider === 'openai') {
      return {
        msg: '無法連線到 ' + normalizeBase(S.oa.base),
        hint: '可能原因：\n' +
          '1. 位址打錯，或該服務沒有提供 /v1 這一層路徑\n' +
          '2. 直接開 HTML 檔時，對方沒有給 CORS 標頭 —— 改用 serve.py 啟動即可轉送\n' +
          '3. 網路不通，或需要 proxy'
      };
    }
    return {
      msg: '無法連線到 ' + S.host,
      hint: '可能原因：\n' +
        '1. Ollama 沒有啟動，或位址 / port 不對\n' +
        '2. 瀏覽器的 CORS 擋下了跨來源請求 —— Ollama 那台要設 OLLAMA_ORIGINS=*\n' +
        '3. 遠端連線時，server 需以 OLLAMA_HOST=0.0.0.0 啟動\n' +
        '若不方便改環境變數，改用 serve.py 啟動即可完全避開 CORS。'
    };
  }
  return { msg: raw };
}

async function apiJson(path, body, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 8000);
  try {
    const res = await fetch(apiUrl(path), {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: ctrl.signal
    });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) { /* 非 JSON */ }
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status + '：' + text.slice(0, 200)));
    return data;
  } finally { clearTimeout(timer); }
}

// 走 serve.py 代理時要顯示真正的 Ollama 位址，不是網頁自己的 port；
// 外部 API 模式則顯示該服務的位址。
function displayHost() {
  const h = S.provider === 'openai' ? normalizeBase(S.oa.base) : (S.upstream || S.host);
  return h.replace(/^https?:\/\//, '');
}

/* ══════════════════════ 外部 OpenAI 相容 API ══════════════════════ */
// num_thread 是套用在跑 Ollama 的那一台。這個判斷由後端做 ——
// 它會把主機名解析出來跟自己的位址比對，所以 --ollama http://<自己的區網IP>
// 也認得出來是本機；前端用正規表示式比字串會漏掉那種寫法。
function ollamaIsLocal() {
  return S.provider !== 'openai' && !!S.srv.ollamaLocal;
}

function normalizeBase(v) {
  v = (v || '').trim().replace(/\/+$/, '');
  if (!v) return 'https://api.openai.com/v1';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return v;
}

function oaTarget(path) { return normalizeBase(S.oa.base) + path; }

// 有 serve.py 就走 /ext 轉送（瀏覽器直接打 api.openai.com 會被 CORS 擋，
// 而且金鑰只在本機之間傳）；直接開檔時只好自己打，成不成看對方給不給 CORS。
function oaFetch(path, body, signal) {
  const target = oaTarget(path);
  const headers = { 'Content-Type': 'application/json' };
  if (S.oa.key) headers['Authorization'] = 'Bearer ' + S.oa.key;
  let url = target;
  if (S.srv.ext) { url = apiUrl('/ext'); headers['X-Target'] = target; }
  const init = { method: body ? 'POST' : 'GET', headers: headers, signal: signal || undefined };
  if (body) init.body = JSON.stringify(body);
  return fetch(url, init);
}

function oaError(data) {
  if (!data) return '';
  if (typeof data.error === 'string') return data.error;
  return (data.error && (data.error.message || data.error.type)) || '';
}

async function oaJson(path, body, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, timeoutMs || 20000);
  try {
    const res = await oaFetch(path, body, ctrl.signal);
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) { /* 非 JSON */ }
    if (!res.ok) throw new Error(oaError(data) || ('HTTP ' + res.status + '：' + text.slice(0, 200)));
    return data;
  } finally { clearTimeout(timer); }
}

// SSE：一行一個 data:，收到 [DONE] 就結束（跟 Ollama 的 NDJSON 不一樣）
async function streamSse(path, body, signal, onObj) {
  const res = await oaFetch(path, body, signal);
  if (!res.ok) {
    const txt = await res.text();
    let data = null;
    try { data = JSON.parse(txt); } catch (e) { /* 非 JSON */ }
    throw new Error(oaError(data) || ('HTTP ' + res.status + '：' + txt.slice(0, 200)));
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buf += decoder.decode(chunk.value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line || line.charAt(0) === ':') continue;        // 空行與心跳
      if (line.indexOf('data:') !== 0) continue;
      const payload = line.slice(5).trim();
      if (payload === '[DONE]') { try { reader.cancel(); } catch (e) { /* 已關 */ } return; }
      let obj;
      try { obj = JSON.parse(payload); } catch (e) { continue; }
      if (obj.error) throw new Error(oaError(obj) || 'API 回報錯誤');
      onObj(obj);
    }
  }
}

// Ollama 的 tool call 沒有 id，arguments 是物件；OpenAI 要 id，arguments 要字串。
function oaToolCall(t, id) {
  const fn = (t && t.function) || {};
  const a = fn.arguments;
  return {
    id: (t && t.id) || id,
    type: 'function',
    function: {
      name: fn.name || '',
      arguments: typeof a === 'string' ? a : JSON.stringify(a || {})
    }
  };
}

// OpenAI 的訊息格式沒有 thinking / images，能對應的就對應。
//
// 工具往返要整串一起看，不能一則一則轉：OpenAI 規定每一則 tool 訊息都要帶
// tool_call_id 指回去，而我們存的格式（照 Ollama 的）沒有這個欄位。
// 順序是固定的 —— assistant 的 tool_calls 後面就是同樣數量、同樣順序的 tool
// 訊息 —— 所以按順序配回去。配不到的（舊對話、或中間被壓縮過）退回純文字，
// 寧可少一點結構也不要讓整串歷史被對方退回。
function oaMsgs(list) {
  const out = [];
  let ids = [];                     // 上一則 assistant 還沒被認領的 tool_call_id
  (list || []).forEach(function (m) {
    if (m.role === 'tool') {
      const id = ids.shift();
      out.push(id
        ? { role: 'tool', tool_call_id: id, content: String(m.content || '') }
        : { role: 'user',
            content: '（工具 ' + (m.tool_name || '') + ' 的執行結果）\n' + (m.content || '') });
      return;
    }
    const item = { role: m.role, content: m.content || '' };
    ids = [];
    if (m.tool_calls && m.tool_calls.length) {
      item.tool_calls = m.tool_calls.map(function (t, i) {
        return oaToolCall(t, 'call_' + out.length + '_' + i);
      });
      ids = item.tool_calls.map(function (t) { return t.id; });
    }
    out.push(item);
  });
  return out;
}

/* ══════════════════════ 連線狀態 ══════════════════════ */
function setConn(state, extra) {
  S.conn = state;
  const shortHost = displayHost();
  const pill = $('statusPill'), dot = $('statusDot');
  dot.className = 'dot ' + (state === 'empty' ? 'ok' : state);
  pill.classList.toggle('error', state === 'error');

  const set = function (text, host, hostColor) {
    $('statusText').textContent = text;
    $('statusHost').textContent = host || '';
    $('statusHost').style.color = hostColor || '';
    $('pillSep').style.display = host ? '' : 'none';
  };

  if (state === 'ok') {
    set('已連線', shortHost);
    $('footInfo').textContent = S.models.length + ' 個模型 · v' + S.version;
    blockComposer('');
  } else if (state === 'empty') {
    set('已連線', '無可用模型', 'var(--warn)');
    $('footInfo').textContent = '沒有已下載的模型';
    blockComposer('沒有可用模型，請先執行 ollama pull');
  } else if (state === 'connecting') {
    set('連線中…', shortHost);
    $('footInfo').textContent = '連線中…';
  } else if (state === 'error') {
    set('無法連線', '');
    $('footInfo').textContent = '連線失敗';
    blockComposer(CONN_HINT);
  } else {
    set('尚未連線', shortHost);
  }
  $('footHost').textContent = shortHost;
  if (extra) S.connMessage = extra;
}

function blockComposer(reason) {
  S.blocked = reason;
  // 「連不上」不鎖送出鍵：送出去會進重試迴圈並顯示倒數，這比「按鍵是灰的、
  // 什麼也做不了」有用。其他理由（沒有可用模型）鎖住是對的。
  const on = !!reason && reason !== CONN_HINT;
  // 輸入框**不鎖**：跑到一半打的字會排隊（見 submitFromInput），
  // 鎖住等於長任務跑十分鐘只能乾等。送出鍵仍然停用 —— 那顆鍵在串流時是「停止」。
  $('input').disabled = false;
  $('sendBtn').disabled = on && !S.streaming;
  $('input').placeholder = reason || '輸入訊息…';
  if (!S.streaming) $('hint').textContent = reason || '';
}

// /upstream 回來的東西裡，跟工具有關的那一半。
function applyAgentState(info) {
  S.srv.tools = !!info.tools;
  S.srv.toolsLocal = !!info.tools_local;
  S.srv.client = info.client || '';
  S.srv.trustRemote = !!info.trust_remote;
  S.srv.browser = !!info.browser;
  S.srv.sandbox = !!info.sandbox;
  S.srv.sandboxInfo = info.sandbox_info || {};
  S.srv.sandboxWhy = S.srv.sandboxInfo.why || '';
  S.ws = Object.assign({ path: '', write: false }, info.workspace || {});
  S.toolDefs = info.tool_defs || [];
  S.agentRules = info.agent_rules || '';
  S.todos = info.todos || [];
  S.jobs = info.jobs || [];      // 重整頁面之後背景指令還在，這裡接得回來
  S.plan = !!info.plan;
  S.mcp = info.mcp || null;
  if (info.stream_tools) S.streamTools = info.stream_tools;
  renderTodos();
}

// serve.py 的程式碼被改過就自己重開，然後重整頁面。
//
// 為什麼需要：網頁每次重整都是新的（build.py 每次重讀 frontend/），Python 卻凍在
// 啟動那一刻。「頁面是新的、serve.py 是舊的」害過兩次 —— 一次是網頁送了新的開關
// 而舊的 serve.py 靜靜忽略，一次是沙盒的 GPU 修好了、跑著的行程還是舊模組，
// 症狀是「明明改好了卻還是不能用」，而且完全看不出原因。
//
// 跑到一半不重開：重啟會把正在跑的工具一起殺掉。等它閒下來再說。
async function checkSourceChanged() {
  if (S.restarting || S.streaming) return;
  let data;
  try {
    const res = await fetch(apiUrl('/alive'), { cache: 'no-store' });
    if (!res.ok) return;                       // 舊版沒有這支，靜靜略過
    data = await res.json();
  } catch (e) { return; }
  if (!data.src_changed || !data.local) return;
  S.restarting = true;
  toast('serve.py 的程式碼改過了，重新啟動…');
  try {
    await fetch(apiUrl('/restart'), { method: 'POST' });
  } catch (e) { /* 回應還沒送完就被換掉也算成功 */ }
  // 等它回來再重整。直接 reload 會撞在還沒 listen 的空檔上。
  for (let i = 0; i < 40; i++) {
    await new Promise(function (r) { setTimeout(r, 500); });
    try {
      const res = await fetch(apiUrl('/alive'), { cache: 'no-store' });
      if (res.ok) { location.reload(); return; }
    } catch (e) { /* 還沒起來 */ }
  }
  S.restarting = false;
  toast('serve.py 重啟後沒有回來，請自己看一下終端機');
}


async function loadUpstream() {
  S.upstream = '';
  S.srv = { tools: false, toolsLocal: false, extract: false, ext: false };
  S.ws = { path: '', write: false, git: false, python: '', files: 0 };
  S.toolDefs = [];
  S.agentRules = '';
  S.todos = [];
  S.atFiles = null;
  S.mcp = null;

  // 直接開 HTML 檔的時候才是真的沒有 serve.py。
  // 這裡以前比的是 S.host === location.origin，等於「把 Ollama 指到別台」
  // 就整組工具跟著消失 —— 那兩件事沒有關係。
  if (!SAME_ORIGIN) { renderFeatBtn(); return; }
  try {
    const info = await apiJson('/upstream', null, 3000);
    S.upstream = info.upstream || '';
    S.srv.extract = !!info.extract;
    S.srv.ext = !!info.ext;
    S.cpus = info.cpus || 0;
    S.srv.ollamaLocal = !!info.ollama_local;
    applyParamLimits();
    applyAgentState(info);
  } catch (e) { /* 不是 serve.py 端出來的，當作沒有 */ }
  // 上次開著就自動接回去，省得每次重開 serve.py 都要再點一次
  if (S.tools && S.srv.toolsLocal && !S.srv.tools) {
    try { await setServerTools({ enabled: true }); } catch (e) { /* 開不起來就算了 */ }
  }
  renderFeatBtn();
  S.treeReady = false;
  if (S.tab === 'file') { S.treeReady = true; renderWorkspace(); }
  else renderWriteBtn();
}

function byModelName(a, b) {
  return (a.name || '').toLowerCase() < (b.name || '').toLowerCase() ? -1 : 1;
}

async function refreshModels(quiet) {
  const seq = ++S.probeSeq;
  if (!quiet) setConn('connecting');
  try {
    if (S.provider === 'openai') {
      const data = await oaJson('/models', null, 20000);
      if (seq !== S.probeSeq) return;
      S.models = (data.data || []).map(function (m) { return { name: m.id }; })
        .filter(function (m) { return m.name; }).sort(byModelName);
      S.version = 'OpenAI 相容';
    } else {
      const tags = await apiJson('/api/tags');
      if (seq !== S.probeSeq) return;          // 已被更新的探測取代
      S.models = (tags.models || []).slice().sort(byModelName);
      try {
        const v = await apiJson('/api/version', null, 5000);
        S.version = (v && v.version) || '?';
      } catch (e) { S.version = '?'; }
    }
    if (seq !== S.probeSeq) return;

    if (!S.models.length) { setConn('empty'); renderModelBtn(); return; }
    const names = S.models.map(function (m) { return m.name; });
    if (names.indexOf(S.model) < 0) S.model = names[0];
    setConn('ok');
    renderModelBtn();
    ensureCaps(S.model);
  } catch (err) {
    if (seq !== S.probeSeq) return;
    const f = friendlyError(err);
    setConn('error', f.hint ? f.msg + '\n' + f.hint : f.msg);
  }
}

async function ensureCaps(model) {
  if (!model) return;
  // OpenAI 相容 API 沒有能力查詢，一律當作沒有 thinking / tools / vision
  if (S.provider === 'openai') { S.caps[model] = []; applyCaps(model); return; }
  if (S.caps[model]) { applyCaps(model); return; }
  try {
    const info = await apiJson('/api/show', { model: model }, 20000);
    S.caps[model] = info.capabilities || [];
    // 層數的鍵前面帶著架構名（qwen35.block_count、llama.block_count…），所以用找的
    const mi = info.model_info || {};
    const key = Object.keys(mi).filter(function (k) { return /\.block_count$/.test(k); })[0];
    if (key) S.layers[model] = mi[key];
    // context 上限同理（qwen35.context_length、llama.context_length…）。
    // num_ctx 填得比這個大時，Ollama 不會報錯，它就是默默用模型的上限 ——
    // 使用者以為自己有 256K，實際上是 32K，然後又撞回「模型好像變笨了」。
    const ck = Object.keys(mi).filter(function (k) { return /\.context_length$/.test(k); })[0];
    if (ck) S.ctxMax[model] = mi[ck];
  } catch (e) { S.caps[model] = []; }
  if (model === S.model) applyCaps(model);
}

function applyCaps(model) {
  const caps = S.caps[model] || [];
  $('capThink').hidden = caps.indexOf('thinking') < 0;
  $('capTools').hidden = caps.indexOf('tools') < 0;
  $('capVision').hidden = caps.indexOf('vision') < 0;
  applyParamLimits();
  $('attachBtn').disabled = !!S.blocked;          // 文字檔任何模型都吃得下
  renderFeatBtn();
  if (caps.indexOf('vision') < 0 && S.images.length) { S.images = []; renderAttach(); }
  renderThinkSeg();
}

/* ══════════════════════ 思考模式 ══════════════════════ */
function thinkOptions() {
  const caps = S.caps[S.model] || [];
  if (caps.indexOf('thinking') < 0) return [];
  return THINK_LEVELS;
}

function renderThinkSeg() {
  const opts = thinkOptions();
  const seg = $('thinkSeg');
  const enabled = opts.length > 0;
  const list = enabled ? opts : THINK_TOGGLE;

  const values = list.map(function (o) { return o[1]; });
  if (values.indexOf(S.think) < 0) S.think = values[0];

  seg.innerHTML = '';
  seg.classList.toggle('disabled', !enabled);
  list.forEach(function (opt, i) {
    const b = document.createElement('button');
    b.textContent = opt[0];
    b.disabled = !enabled;
    if (opt[1] === S.think) b.className = 'on';
    b.addEventListener('click', function () {
      S.think = opt[1];
      renderThinkSeg();
      saveConfig();
    });
    seg.appendChild(b);
  });

  // 只留「這個模型能不能用」這一句狀態，其餘說明收進驚嘆號 ——
  // 那段字每次打開參數面板都在，看第二次就變成雜訊了。
  $('thinkNote').textContent = enabled ? ''
    : (S.model || '此模型') + ' 不支援 thinking，控制項已停用。';
  $('thinkNote').hidden = enabled;
}

function openThinkHelp() {
  openHelp('思考模式', [
    ['這是什麼', '讓模型先想再答。想的過程會另外顯示，不算在回覆裡。'],
    ['強度分級', 'Ollama 的「思考預算」就是這五段（關／低／中／高／最高，'
      + '對應 think: false / low / medium / high / max），'
      + '**沒有**用 token 數設預算的介面。'],
    ['想硬性設上限', '用 num_predict —— 它算的是輸出總量，思考也計入。'],
    ['模型不支援分級', '會把任何一個等級當成「開啟」，不會報錯。'],
    ['模型完全不支援', '控制項會停用，送出時整個 think 欄位省略，不會送出去。']
  ]);
}

function thinkValue() { return thinkOptions().length ? S.think : null; }

// --fs 宣告在 :root，這裡也設在同一個節點上。設在 body 或宣告在 body
// 都會踩到「body 自己的宣告贏過繼承值」，那次的症狀是設定完全沒反應。
function applyFontScale() {
  document.documentElement.style.setProperty('--fs', String(S.fontScale));
  // 使用者正在那個欄位裡打字時不要蓋掉他打到一半的東西
  if ($('fsValue') && document.activeElement !== $('fsValue')) $('fsValue').value = fontLabel();
  if ($('fsMinus')) $('fsMinus').disabled = fontPct() <= FONT_MIN;
  if ($('fsPlus')) $('fsPlus').disabled = fontPct() >= FONT_MAX;
}

function fontPct() { return Math.round(S.fontScale * 100); }
function fontLabel() { return fontPct() + '%'; }

// 一次 1%。夾在 70～200 之間，存起來下次打開直接套用。
function stepFont(delta) { setFont(fontPct() + delta); }

// 直接輸入的入口。打不出數字就把欄位還原成現值，不要留一個看不懂的狀態。
function setFont(pct) {
  const n = parseInt(String(pct).replace('%', '').trim(), 10);
  if (isNaN(n)) { applyFontScale(); return; }
  S.fontScale = Math.min(FONT_MAX, Math.max(FONT_MIN, n)) / 100;
  applyFontScale();
  saveConfig();
}

/* ══════════════════════ 參數 ══════════════════════ */
function buildOptions() {
  const p = S.params;
  const o = {
    temperature: +(+p.temperature).toFixed(3),
    top_p: +(+p.top_p).toFixed(3),
    top_k: parseInt(p.top_k, 10),
    repeat_penalty: +(+p.repeat_penalty).toFixed(3)
  };
  const minP = +(+p.min_p).toFixed(3);
  if (minP > 0) o.min_p = minP;
